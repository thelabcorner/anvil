# Independent I15-T 16-value tiled residual experiment; manual GitHub Actions only.
name: ANVIL I15-T adaptive 16-value innovations
on: workflow_dispatch
permissions:
  contents: read
jobs:
  discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      SOURCE: prototypes/i15-tiled/i15_tiled.cpp
      SOURCE_SHA: 2b2a891af077d51f53d26b22c05098e59a7ea2530015de75fcd9fb16d4afb4c7
      SOURCE_BLOB: b63136b8d4cc38bd5deca0bbdca1e5c396d36e15
      CONTROL: prototypes/i13-strided/i13_strided.cpp
      CONTROL_SHA: 274be4c8a5de222b4bbb16c586fc04310dd1deadd455dacc7741110b8dfcb7c0
      CONTROL_BLOB: ca3f9e684917b276f6a4274de62c3b20ca73fa95
      BROTLI_SHA: ed738e842d2fbdf2d6459e39267a633c4a9b2f5d
      BROTLI_SRC: ${{ github.workspace }}/../i15t-brotli-src
      BROTLI_BUILD: ${{ github.workspace }}/../i15t-brotli-build
      OUT: ${{ github.workspace }}/i15t-results
    steps:
      - name: Checkout pinned dispatched source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Attest frozen candidate, control, exact tracked inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "HEAD:$SOURCE")" = "$SOURCE_BLOB"
          test "$(git rev-parse "HEAD:$CONTROL")" = "$CONTROL_BLOB"
          echo "$SOURCE_SHA  $SOURCE" | sha256sum -c -
          echo "$CONTROL_SHA  $CONTROL" | sha256sum -c -
          test -z "$(git status --porcelain)"
          mkdir -p "$OUT"
          {
            echo "commit=$GITHUB_SHA"
            echo "I15T_blob=$SOURCE_BLOB I15T_sha256=$SOURCE_SHA"
            echo "I13_blob=$CONTROL_BLOB I13_sha256=$CONTROL_SHA"
            echo "Brotli_source_commit=$BROTLI_SHA"
            echo "class=consumed-discovery frontier_crossing=false"
            g++ --version | head -n 1
            cmake --version | head -n 1
          } | tee "$OUT/provenance.txt"
          for f in tests/corpus/synth-arith.bin tests/corpus/synth-timeseries.bin tests/corpus/synth-jitter.bin tests/corpus/random.bin tests/corpus/generated.repeat.jsonl tests/corpus/generated.jsonl tests/corpus/src.cpp; do
            test -f "$f"
            blob="$(git rev-parse "HEAD:$f")"
            test "$(git hash-object "$f")" = "$blob"
            echo "$f blob=$blob sha256=$(sha256sum "$f" | cut -d' ' -f1)" | tee -a "$OUT/provenance.txt"
          done
      - name: Build pinned static Brotli q5 and q11 controls
        shell: bash
        run: |
          set -euo pipefail
          git init -q "$BROTLI_SRC"
          git -C "$BROTLI_SRC" remote add origin https://github.com/google/brotli.git
          git -C "$BROTLI_SRC" fetch -q --depth 1 origin "$BROTLI_SHA"
          git -C "$BROTLI_SRC" checkout -q --detach FETCH_HEAD
          test "$(git -C "$BROTLI_SRC" rev-parse HEAD)" = "$BROTLI_SHA"
          cmake -S "$BROTLI_SRC" -B "$BROTLI_BUILD" -DCMAKE_BUILD_TYPE=Release -DBROTLI_DISABLE_TESTS=ON -DBUILD_SHARED_LIBS=OFF
          cmake --build "$BROTLI_BUILD" --target brotlienc brotlidec brotlicommon -j 2
      - name: Compile frozen I13 and I15-T with identical compiler and flags
        shell: bash
        run: |
          set -euo pipefail
          lib() { find "$BROTLI_BUILD" -name "lib$1.a" -print -quit; }
          for name in brotlienc brotlidec brotlicommon; do test -f "$(lib "$name")"; done
          for v in 13 15t; do
            if [ "$v" = 13 ]; then input="$CONTROL"; else input="$SOURCE"; fi
            g++ -std=c++20 -O3 -DNDEBUG -Wall -Wextra -Wpedantic -DI13_WITH_BROTLI -DI15_WITH_BROTLI \
              -I "$BROTLI_SRC/c/include" "$input" -o "$RUNNER_TEMP/i$v" \
              "$(lib brotlienc)" "$(lib brotlidec)" "$(lib brotlicommon)" -pthread
            sha256sum "$RUNNER_TEMP/i$v" | tee -a "$OUT/binary-hashes.txt"
            wc -c "$RUNNER_TEMP/i$v" | tee -a "$OUT/binary-sizes.txt"
          done
      - name: Validate exact inverse and malformed-wire rejection
        shell: bash
        run: |
          set -euo pipefail
          for v in 13 15t; do
            "$RUNNER_TEMP/i$v" --selftest | tee "$OUT/selftest-$v.txt"
            grep -F "SELFTEST PASS" "$OUT/selftest-$v.txt"
            for f in tests/corpus/synth-arith.bin tests/corpus/synth-timeseries.bin tests/corpus/synth-jitter.bin tests/corpus/random.bin tests/corpus/generated.repeat.jsonl tests/corpus/generated.jsonl tests/corpus/src.cpp; do
              "$RUNNER_TEMP/i$v" --encode "$f" "$OUT/check-$v.bin"
              "$RUNNER_TEMP/i$v" --decode "$OUT/check-$v.bin" "$OUT/decoded-$v.bin"
              cmp "$f" "$OUT/decoded-$v.bin"
              echo "ROUNDTRIP_PASS I$v $f" | tee -a "$OUT/roundtrips.txt"
            done
          done
      - name: Paired seven-file complete-wire and digest-observed throughput
        shell: bash
        run: |
          set -euo pipefail
          for v in 13 15t; do
            "$RUNNER_TEMP/i$v" --bench \
              tests/corpus/synth-arith.bin tests/corpus/synth-timeseries.bin tests/corpus/synth-jitter.bin \
              tests/corpus/random.bin tests/corpus/generated.repeat.jsonl tests/corpus/generated.jsonl \
              tests/corpus/src.cpp | tee "$OUT/benchmark-$v.tsv"
          done
          python3 tools/i15_tiled_decide.py "$OUT/benchmark-13.tsv" "$OUT/benchmark-15t.tsv" "$OUT/decision.json"
      - name: Upload source-attested evidence even after failure
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: anvil-i15t-${{ github.sha }}-run${{ github.run_attempt }}
          path: ${{ env.OUT }}
          if-no-files-found: warn
          retention-days: 90
