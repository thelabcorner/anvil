      - name: Verify B1/FLOOR exact reproduction of frozen G5A A3 (I10)
        id: floor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          python3 - <<'PY'
          import json, os, pathlib

          def load(path):
              return [json.loads(x) for x in pathlib.Path(path).read_text().splitlines()
                      if x.strip()]

          def fail(msg, extra=None):
              payload = {"ok": False, "reason": msg}
              if extra:
                  payload.update(extra)
              pathlib.Path("results/floor-check.json").write_text(
                  json.dumps(payload, indent=2) + "\n")
              raise SystemExit("INVALID-B1-FLOOR: " + msg)

          rows = load("results/g5b-discovery.jsonl")
          b1 = {pathlib.Path(r["file"]).name: r for r in rows}

          g5a = {pathlib.Path(r["file"]).name: r for r in
                 load("floor_evidence/g5a-discovery.jsonl")}
          if len(g5a) != 4:
              fail(f"archived G5A discovery rows != 4 ({len(g5a)})")

          replay = {pathlib.Path(r["file"]).name: r for r in
                    load("results/g5a-replay-discovery.jsonl")}
          if len(replay) != 4:
              fail(f"same-run G5A replay rows != 4 ({len(replay)})")

          # ---- Backend provenance comparability (I10), authoritative which is which.
          ruling = json.loads(pathlib.Path("floor_evidence/g5a-ruling.json").read_text())
          g5a_versions = {(v["integer"], v["dotted"]) for v in
                          ruling["backend"]["brotli_encoder_versions"]}
          g5a_packages = set(ruling["backend"]["package_identity"])
          # Archived linked-libbrotli digests, when the archive exposes them.
          g5a_lib = {}
          lib_path = pathlib.Path("floor_evidence/brotli-library-sha256.txt")
          if lib_path.exists():
              for line in lib_path.read_text().splitlines():
                  parts = line.split()
                  if len(parts) >= 2:
                      g5a_lib[pathlib.Path(parts[-1]).name] = parts[0]
          # This-run linked-libbrotli digests.
          run_lib = {}
          for line in pathlib.Path("brotli-library-sha256.txt").read_text().splitlines():
              parts = line.split()
              if len(parts) >= 2:
                  run_lib[pathlib.Path(parts[-1]).name] = parts[0]

          checked = []
          for name in sorted(b1):
              if name not in g5a:
                  fail(f"archived G5A has no row for {name}")
              if name not in replay:
                  fail(f"same-run G5A replay has no row for {name}")
              a3 = g5a[name]["a3_shape_column"]
              a3_top = g5a[name]
              b1_arm = b1[name]["b1_ordinal_floor"]
              # (a) complete-byte equality (per file).
              if b1_arm["complete_bytes"] != a3["complete_bytes"]:
                  fail(f"{name}: B1 complete {b1_arm['complete_bytes']} != "
                       f"G5A A3 {a3['complete_bytes']}")
              # (b) envelope facts.
              if a3["envelope_sha256"] != a3_top["envelope_sha256"]:
                  fail(f"{name}: archived A3/top envelope sha256 disagree")
              if b1_arm["envelope_sha256"] != a3["envelope_sha256"]:
                  fail(f"{name}: B1 envelope sha256 != archived G5A A3")
              if b1_arm["envelope_len"] != a3["envelope_len"]:
                  fail(f"{name}: B1 envelope_len != archived G5A A3")
              # (c) body length.
              if b1_arm["body_bytes"] != a3["body_bytes"]:
                  fail(f"{name}: B1 body_bytes != archived G5A A3")
              # (d) token-region length.
              if b1_arm["token_region_len"] != a3["token_region_len"]:
                  fail(f"{name}: B1 token_region_len != archived G5A A3")
              # (e) canonical multiset (supporting invariant, not sufficient alone).
              if b1_arm["canonical_token_multiset_sha256"] != \
                      a3["canonical_token_multiset_sha256"]:
                  fail(f"{name}: B1 multiset sha256 != archived G5A A3")
              # (f) carrier parameters.
              if a3.get("carrier_quality") != 11 or a3.get("carrier_window") != 30:
                  fail(f"{name}: archived G5A A3 carrier parameters unexpected")
              if b1_arm.get("carrier_quality") != 11 or \
                      b1_arm.get("carrier_window") != 30:
                  fail(f"{name}: B1 carrier parameters != 11/30")
              # (g) archived structural counts where stable/useful.
              for key in ("shape_count", "token_chunk_count", "frame_count",
                          "structured_frame_count", "raw_frame_count"):
                  if key in a3_top and key in b1[name]:
                      if a3_top[key] != b1[name][key]:
                          fail(f"{name}: B1 {key} != archived G5A")
              if "structured_token_bytes" in a3_top and \
                      "structured_token_bytes" in b1[name]:
                  if a3_top["structured_token_bytes"] != b1[name]["structured_token_bytes"]:
                      fail(f"{name}: B1 structured_token_bytes != archived G5A")
              # (h) same-run replay must reproduce the archived A3 facts.
              ra3 = replay[name]["a3_shape_column"]
              if ra3["complete_bytes"] != a3["complete_bytes"]:
                  fail(f"{name}: same-run G5A replay A3 complete_bytes drift "
                       f"({ra3['complete_bytes']} != {a3['complete_bytes']}) - "
                       f"environment drift")
              if ra3["envelope_sha256"] != a3["envelope_sha256"]:
                  fail(f"{name}: same-run G5A replay A3 envelope drift")
              if ra3["canonical_token_multiset_sha256"] != \
                      a3["canonical_token_multiset_sha256"]:
                  fail(f"{name}: same-run G5A replay A3 multiset drift")
              checked.append(name)

          # (i) backend provenance comparability (authoritative G5A vs this run).
          run_versions = set()
          for r in rows:
              run_versions.add((r["brotli_encoder_version"],
                                r["brotli_encoder_version_dotted"]))
          if run_versions != g5a_versions:
              fail(f"BrotliEncoderVersion mismatch: run {sorted(run_versions)} != "
                   f"archived {sorted(g5a_versions)}")
          run_packages = set(pathlib.Path("brotli-package-identity.txt")
                             .read_text().splitlines())
          if not g5a_packages.issubset(run_packages):
              fail(f"libbrotli package version mismatch: archived {sorted(g5a_packages)} "
                   f"not a subset of run {sorted(run_packages)}")
          for lib, digest in g5a_lib.items():
              if lib in run_lib and run_lib[lib] != digest:
                  fail(f"linked libbrotli {lib} sha256 mismatch: run {run_lib[lib]} "
                       f"!= archived {digest}")
              elif lib not in run_lib:
                  fail(f"linked libbrotli {lib} missing from this run's provenance")

          pathlib.Path("results/floor-check.json").write_text(
              json.dumps({"ok": True, "checked_files": checked,
                          "g5a_run": os.environ["G5A_REFERENCE_RUN_ID"],
                          "g5a_artifact_id": os.environ["G5A_ARTIFACT_ID"],
                          "g5a_artifact_digest": os.environ["G5A_ARTIFACT_DIGEST"],
                          "g5a_implementation_sha":
                              os.environ["G5A_REFERENCE_IMPLEMENTATION_SHA"],
                          "g5a_source_blob": os.environ["G5A_REFERENCE_SOURCE_BLOB"],
                          "same_run_replay": True,
                          "backend_versions": sorted(
                              [{"integer": v[0], "dotted": v[1]} for v in run_versions],
                              key=lambda x: (x["integer"], x["dotted"])),
                          "linked_libbrotli": run_lib},
                         indent=2) + "\n")
          print("I10 B1/FLOOR exact reproduction + provenance + replay verified for",
                checked)
          PY
          echo "floor_ok=true" >> "$GITHUB_OUTPUT"

      - name: Frozen ruling (sections 10 and 10.1, applied mechanically)
        id: ruling
        if: ${{ always() }}
        shell: bash
        run: |
          mkdir -p results || true
          python3 - <<'PY'
          import json, os, pathlib

          # ---- Frozen thresholds (verbatim from the G5B-ORDINAL prereg) ------
          ORDINAL_MATERIAL_AGG = 0.99    # S2/S1 <= 0.99  (>= 1.0% aggregate)
          MATERIAL_NONDEGEN_MIN = 2      # B2 < B1 on >= 2 non-degenerate files

          DISCOVERY = {"D1-amazon-cellphones.ndjson", "D2-cdisc-adae.ndjson",
                       "D3-gharchive-10mb.ndjson", "D4-crovia-dpi-receipts.ndjson"}
          ARM_KEYS = ("b0_ordinal_null", "b1_ordinal_floor", "b2_ordinal_blocked")

          def load(path):
              return [json.loads(x) for x in pathlib.Path(path).read_text().splitlines()
                      if x.strip()]

          def write_ruling(payload, classification):
              pathlib.Path("results/g5b-ruling.json").write_text(
                  json.dumps(payload, indent=2) + "\n")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
                  f.write(f"classification={classification}\n")

          # ---- B1 floor gate (I10) takes precedence -------------------------
          floor_ok = False
          floor_path = pathlib.Path("results/floor-check.json")
          if floor_path.exists():
              floor_ok = bool(json.loads(floor_path.read_text()).get("ok"))
          if not floor_ok:
              classification = "INVALID-B1-FLOOR"
              write_ruling({"schema": 1, "classification": classification,
                            "reason": "B1/FLOOR mismatch, provenance mismatch, replay drift, or missing floor evidence",
                            "b2_interpretation_prohibited": True}, classification)
              print("INVALID-B1-FLOOR: B2 interpretation prohibited")
              raise SystemExit(0)

          discs = {pathlib.Path(r["file"]).name: r for r in load("results/g5b-discovery.jsonl")}
          if set(discs) != DISCOVERY:
              raise SystemExit(f"unexpected discovery rows: {sorted(discs)}")

          invariants_ok = True
          backend_versions = set()
          for r in discs.values():
              if not (r["body_size_identity"] and r["envelope_len_identity"] and
                      r["token_region_len_identity"] and r["envelope_identity"] and
                      r["invariant_hashes_identical"] and r["all_permutations_exact"] and
                      r["all_mode_pack_unpack"] and r["all_roundtrip"]):
                  invariants_ok = False
              if r["carrier_quality"] != 11 or r["carrier_window"] != 30:
                  invariants_ok = False
              # I11 fail-closed liveness consistency.
              if r["shared_ordinal_slots"] > r["max_slots"]:
                  invariants_ok = False
              if r["b1_eq_b2"] != (r["b2_moved_token_count"] == 0):
                  invariants_ok = False
              if r["b1_eq_b2"] and r["shared_ordinal_slots"] != 0:
                  invariants_ok = False
              backend_versions.add((r["brotli_encoder_version"],
                                    r["brotli_encoder_version_dotted"]))
              env_hash = r["envelope_sha256"]
              multiset_hash = r["canonical_token_multiset_sha256"]
              for key in ARM_KEYS:
                  arm = r[key]
                  if not (arm["roundtrip"] and arm["permutation_ok"] and
                          arm["mode_pack_unpack_ok"]):
                      invariants_ok = False
                  if (arm["envelope_sha256"] != env_hash or
                          arm["canonical_token_multiset_sha256"] != multiset_hash):
                      invariants_ok = False
          if len(backend_versions) != 1:
              invariants_ok = False

          B0 = sum(discs[n][ARM_KEYS[0]]["complete_bytes"] for n in DISCOVERY)
          B1 = sum(discs[n][ARM_KEYS[1]]["complete_bytes"] for n in DISCOVERY)
          B2 = sum(discs[n][ARM_KEYS[2]]["complete_bytes"] for n in DISCOVERY)

          b2_vs_b1_bytes = B1 - B2
          b2_vs_b0_bytes = B0 - B2

          # Non-degenerate families (I11): B2 < B1 AND not b1_eq_b2.
          b2_smaller_nondegenerate = sum(
              1 for n in DISCOVERY
              if (discs[n][ARM_KEYS[2]]["complete_bytes"]
                  < discs[n][ARM_KEYS[1]]["complete_bytes"])
              and not discs[n]["b1_eq_b2"])

          # Frozen precedence (prereg section 10).
          if not invariants_ok:
              classification = "INVALID-G5B-ORDINAL"
          elif B2 > B1:
              classification = "ORDINAL-ADVERSE"
          elif B2 == B1:
              classification = "ORDINAL-NEUTRAL"
          elif B2 >= B0:
              classification = "ORDINAL-UNSUPPORTED-BY-NULL"
          elif B2 / B1 > ORDINAL_MATERIAL_AGG:
              classification = "ORDINAL-WEAK"
          elif b2_smaller_nondegenerate < MATERIAL_NONDEGEN_MIN:
              classification = "ORDINAL-CONCENTRATED"
          else:
              classification = "ORDINAL-MATERIAL"

          def ratio(num, den):
              return (num / den) if den else None

          # V1 diagnostic (known-stress; not a held-out test). Fail closed first.
          v1_rows = load("results/g5b-v1.jsonl")
          v1 = v1_rows[-1]
          v1_ok = bool(
              v1["body_size_identity"] and v1["envelope_len_identity"] and
              v1["token_region_len_identity"] and v1["envelope_identity"] and
              v1["invariant_hashes_identical"] and v1["all_permutations_exact"] and
              v1["all_mode_pack_unpack"] and v1["all_roundtrip"] and
              v1["carrier_quality"] == 11 and v1["carrier_window"] == 30)
          v1_env = v1["envelope_sha256"]
          v1_ms = v1["canonical_token_multiset_sha256"]
          for k in ARM_KEYS:
              a = v1[k]
              if not (a["roundtrip"] and a["permutation_ok"] and a["mode_pack_unpack_ok"]):
                  v1_ok = False
              if a["envelope_sha256"] != v1_env or a["canonical_token_multiset_sha256"] != v1_ms:
                  v1_ok = False
          if not v1_ok:
              pathlib.Path("results/g5b-ruling.json").write_text(
                  json.dumps({"schema": 1,
                              "classification": classification,
                              "v1_known_stress": {"label": "V1-INVALID-G5B-ORDINAL",
                                                  "role": "known-stress-not-held-out"},
                              "reason": "V1 invariants failed; no V1-ORDINAL-* label permitted",
                              "b2_interpretation_prohibited": True}, indent=2) + "\n")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
                  f.write(f"classification={classification}\n")
              raise SystemExit(
                  "FAIL CLOSED: V1 invariants failed; no V1-ORDINAL-* label permitted")

          v1_b0 = v1[ARM_KEYS[0]]["complete_bytes"]
          v1_b1 = v1[ARM_KEYS[1]]["complete_bytes"]
          v1_b2 = v1[ARM_KEYS[2]]["complete_bytes"]
          if v1_b2 < v1_b1:
              v1_label = "V1-ORDINAL-FAVORABLE"
          elif v1_b2 == v1_b1:
              v1_label = "V1-ORDINAL-NEUTRAL"
          else:
              v1_label = "V1-ORDINAL-ADVERSE"

          ruling = {
              "schema": 1,
              "implementation_sha": os.environ["FROZEN_IMPLEMENTATION_SHA"],
              "g5b_source_sha256": os.environ.get("G5B_SOURCE_SHA256", ""),
              "frozen_g3_sha": os.environ["FROZEN_G3_SHA"],
              "prereg": "docs/I10-GROTLI-G5B-ORDINAL-PREREG.md",
              "prereg_revision": "r2",
              "selector_bytes": {"b1_ordinal_floor": 3, "b0_ordinal_null": 4,
                                 "b2_ordinal_blocked": 5},
              "carrier_magic": "G5AO",
              "thresholds": {
                  "ordinal_material_aggregate_ratio": ORDINAL_MATERIAL_AGG,
                  "material_nondegenerate_files_min": MATERIAL_NONDEGEN_MIN,
              },
              "floor_ok": floor_ok,
              "invariants_ok": invariants_ok,
              "backend": {
                  "brotli_encoder_versions": sorted(
                      [{"integer": v[0], "dotted": v[1]} for v in backend_versions],
                      key=lambda x: (x["integer"], x["dotted"])),
                  "package_identity":
                      pathlib.Path("brotli-package-identity.txt").read_text().splitlines(),
              },
              "aggregate": {
                  "B0_ordinal_null": B0,
                  "B1_ordinal_floor": B1,
                  "B2_ordinal_blocked": B2,
                  "b2_vs_b1_bytes": b2_vs_b1_bytes,
                  "b2_vs_b0_bytes": b2_vs_b0_bytes,
                  "b2_vs_b1_ratio": ratio(B2, B1),
                  "b2_smaller_nondegenerate_files": b2_smaller_nondegenerate,
              },
              "per_file": {
                  n: {
                      "B0": discs[n][ARM_KEYS[0]]["complete_bytes"],
                      "B1": discs[n][ARM_KEYS[1]]["complete_bytes"],
                      "B2": discs[n][ARM_KEYS[2]]["complete_bytes"],
                      "b2_vs_b1_bytes": discs[n]["b2_vs_b1_bytes"],
                      "b2_vs_b0_bytes": discs[n]["b2_vs_b0_bytes"],
                      "b1_vs_b0_bytes": discs[n]["b1_vs_b0_bytes"],
                      "shape_count": discs[n]["shape_count"],
                      "max_slots": discs[n]["max_slots"],
                      "shared_ordinal_slots": discs[n]["shared_ordinal_slots"],
                      "cross_shape_ordinal_tokens":
                          discs[n][ARM_KEYS[2]]["cross_shape_ordinal_tokens"],
                      "b1_eq_b2": discs[n]["b1_eq_b2"],
                      "b2_moved_token_count": discs[n]["b2_moved_token_count"],
                      "degenerate": bool(discs[n]["b1_eq_b2"]),
                      "envelope_sha256": discs[n]["envelope_sha256"],
                      "canonical_token_multiset_sha256":
                          discs[n]["canonical_token_multiset_sha256"],
                      "token_chunk_count": discs[n]["token_chunk_count"],
                  } for n in sorted(DISCOVERY)
              },
              "floor_verification": json.loads(
                  pathlib.Path("results/floor-check.json").read_text()),
              "classification": classification,
              "v1_known_stress": {
                  "B0": v1_b0, "B1": v1_b1, "B2": v1_b2,
                  "b1_to_b2_bytes": v1_b1 - v1_b2,
                  "b0_to_b2_bytes": v1_b0 - v1_b2,
                  "label": v1_label,
                  "role": "known-stress-not-held-out",
              },
              "opens_new_held_out_corpus": False,
              "production_transform_id_allocated": False,
              "semantic_hierarchy_lane_open": True,
          }
          pathlib.Path("results/g5b-ruling.json").write_text(
              json.dumps(ruling, indent=2) + "\n")
          md = [
              "# G5B-ORDINAL ruling",
              "",
              f"- implementation SHA: `{ruling['implementation_sha']}`",
              f"- G5B-ORDINAL source sha256: `{ruling['g5b_source_sha256']}`",
              f"- carrier magic: `G5AO`  selector bytes B1/B0/B2: 3/4/5",
              f"- B1/FLOOR reproduced frozen G5A A3 + provenance + replay (run "
              f"{os.environ['G5A_REFERENCE_RUN_ID']}): **{floor_ok}**",
              f"- invariants ok: **{invariants_ok}**",
              f"- D1-D4 B0/B1/B2: **{B0}** / **{B1}** / **{B2}**",
              f"- b2_vs_b1_bytes: **{b2_vs_b1_bytes}**  "
              f"b2_vs_b0_bytes: **{b2_vs_b0_bytes}**",
              f"- B2 smaller on non-degenerate files: "
              f"**{b2_smaller_nondegenerate}/4**",
              f"- classification: **{classification}**",
              f"- V1 (known-stress): **{v1_label}** "
              f"(B0={v1_b0} B1={v1_b1} B2={v1_b2})",
              "",
              "A MATERIAL result means only that exact-shape boundaries fragment",
              "positional same-ordinal locality on D1-D4; it does NOT mean slots are",
              "logical fields, does NOT establish generalization, and does NOT",
              "validate a production transform. A non-pass closes only the ordinal",
              "proxy, not semantic hierarchy.",
              "",
              "No production transform ID. No new held-out corpus. Raw Brotli remains",
              "the permanent fallback. G4 remains NO-GO.",
          ]
          pathlib.Path("results/g5b-ruling.md").write_text("\n".join(md) + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"classification={classification}\n")
          print(json.dumps(ruling, indent=2))
          PY
          if [ -f results/g5b-ruling.md ]; then
            cat results/g5b-ruling.md >> "$GITHUB_STEP_SUMMARY" || true
          fi

      - name: Upload G5B-ORDINAL evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: grotli-g5b-ordinal-${{ github.run_id }}
          path: |
            results/
            floor_evidence/
            g5a_replay/
            grotli-g5b-binary.sha256
            grotli-g5b-prereg.sha256
            grotli-g5b.d
            grotli-g3-binary.sha256
            grotli-g3-source.blob
            grotli-g3-source.sha256
            grotli-g3-source-identity.txt
            compiler-identity.txt
            brotli-package-identity.txt
            brotli-library-sha256.txt
            grotli-g5b-implementation-identity.txt
            results-runner.txt
          if-no-files-found: error
          retention-days: 30
