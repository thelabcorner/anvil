name: ANVIL I10 Grotli G5B-ORDINAL probe

# Preregistration: docs/I10-GROTLI-G5B-ORDINAL-PREREG.md  (frozen revision r2)
# Parent evidence:  G5A ORDER-MATERIAL/COLUMN-DOMINANT (run 35985412906),
#                   G4 NO-GO-G4, G3 PASS-G3-NARROW
#
# G5B-ORDINAL is an interstitial, sharply causal probe, not a codec and not a
# planner. It holds the reversible token/chunk multiset and the charged envelope
# constant while changing ONLY the permutation of the exact same lexical scalar
# chunks before the same Brotli q11/lgwin30 backend.
#
# Sharp question: does the boundary between exact lexical shapes fragment
# positional same-ordinal slot locality?
#
# Three arms, frozen (deliberately NO B3 in this first freeze). The carrier body
# shares the EXACT frozen G5A "G5AO" magic so that B1/FLOOR can be byte-compatible
# with frozen G5A A3; selector values avoid semantic aliasing with G5A's mode space:
#   B1 ORDINAL_FLOOR   selector 3  EXACT frozen G5A A3 SHAPE_COLUMN (already-spent floor)
#   B0 ORDINAL_NULL    selector 4  deterministic structure-destroying null draw (one seed)
#   B2 ORDINAL_BLOCKED selector 5  global-ordinal blocked emission (the single treatment)
# Selector bytes 0/1/2 are INVALID in G5B-ORDINAL (they alias G5A A0/A1/A2 on the
# shared G5AO carrier).
#
# Hard invariants that gate every size number (prereg section 6):
#   I1  exact source roundtrip every arm (body + charged selector byte)
#   I2  body length AND envelope length AND token-region length identities
#   I3  exact permutation + canonical token-multiset SHA-256 identity
#   I4  common-envelope SHA-256 identity and unchanged raw residuals
#   I5  same backend: Brotli q11/lgwin30 and same build/provenance identity
#   I6  no typed leaf / new representation family
#   I7  exactly one charged selector byte {3,4,5}, pack/unpack, invalid selector fails closed
#   I8  compiler/pkg/libbrotli provenance; linked libbrotli SHA-256; BrotliEncoderVersion
#   I9  deterministic null present and actually reorders on nontrivial fixtures
#   I10 B1/FLOOR exact reproduction of frozen G5A A3 on D1-D4 vs run 35985412906,
#       strengthened per-file facts + backend provenance comparability + a same-run
#       frozen G5A reference replay control (section 7.3)
#   I11 liveness/degeneracy: shape_count, max_slots, shared_ordinal_slots,
#       cross_shape_ordinal_tokens, b1_eq_b2, b2_moved_token_count; impossible
#       combinations fail closed
#   I12 no floor/provenance/invariant failure falls through to a favorable label;
#       artifact upload is if: always()
# Any invariant failure => INVALID-G5B-ORDINAL (or INVALID-B1-FLOOR for I10).
#
# This workflow:
#   1. checks out the pinned G5B-ORDINAL implementation SHA and verifies identity;
#   2. pins the apt libbrotli version and fails closed on backend drift (I5/I8);
#   3. materializes the frozen G3 source and compiles G5B-ORDINAL against those
#      exact pinned bytes, warning-clean, then runs the full adversarial selftest;
#   4. builds a SEPARATE frozen G3 reference from the same materialized source and
#      selftests it, proving the imported parser/shape semantics;
#   5. acquires and verifies the authoritative frozen G5A floor artifact
#      (run 35985412906) with exact member-path extraction and pinned digest (I10);
#   6. fetches and verifies the frozen D1-D4 discovery objects and V1;
#   7. runs a same-run frozen G5A reference replay on D1-D4 ONLY (control gate, after
#      corpus identity verification; not a new experiment) and compares its A3 facts
#      to the archive, so environment drift is diagnosable;
#   8. runs frozen B0/B1/B2 on D1-D4 and on V1 (known-stress anatomy);
#   9. verifies B1 exact reproduction of the frozen G5A A3 on D1-D4 (I10);
#  10. applies the frozen section-10/10.1 ruling MECHANICALLY, fail-closed;
#  11. uploads the complete evidence with if: always() (invalid evidence preserved).
#
# V1 is KNOWN-STRESS / NOT HELD-OUT FOR G5B-ORDINAL. No new held-out corpus is
# opened. V1 correctness is RE-GATED inside the final ruling; a V1 invariant
# failure fails closed (never a V1-ORDINAL-* label). V1 remains a known-stress
# diagnostic only and MUST be re-gated separately from the discovery ruling.
# Heavy compression runs ONLY here, never on the workstation.
# This workflow is NOT dispatched by the freezing worker.

on:
  workflow_dispatch:

concurrency:
  group: anvil-i10-grotli-g5b-ordinal
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  ordinal:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      # Pinned public G5B-ORDINAL implementation commit. The workflow lands AFTER
      # this commit so the implementation identity is immutable before CI.
      # PLACEHOLDER: the freezing worker does not dispatch; the operator re-pins
      # this to the real frozen G5B-ORDINAL commit before the first dispatch.
      FROZEN_IMPLEMENTATION_SHA: PLACEHOLDER_G5B_ORDINAL_IMPLEMENTATION_SHA
      # Expected git blob identities of the pinned implementation commit's
      # G5B-ORDINAL source and prereg (checked before any measurement).
      # PLACEHOLDER: re-pin to the real frozen blobs before the first dispatch.
      EXPECTED_G5B_SOURCE_BLOB: PLACEHOLDER_G5B_ORDINAL_SOURCE_BLOB
      EXPECTED_G5B_PREREG_BLOB: PLACEHOLDER_G5B_ORDINAL_PREREG_BLOB
      # Frozen G3 source identity whose parser/shape semantics G5B-ORDINAL imports.
      FROZEN_G3_SHA: 1a3d18fed76adb6fb33264e1994f9c357306b3fa
      # Authoritative blob/SHA-256 of the frozen G3 source at FROZEN_G3_SHA.
      EXPECTED_G3_SOURCE_BLOB: eedc7b7e6671c4a5fcaf7a5997671bd4be30bdde
      EXPECTED_G3_SOURCE_SHA256: 5b3ab1cdc67d1a8d8edd7eeb4265361a66f72e5b8620137149ce802233b58a9e
      # Authoritative archived G5A floor evidence (I10). Metadata determined
      # read-only via the GitHub REST API at correction time (2026-09-24):
      #   artifact id 10801714249, size 15631 bytes,
      #   digest sha256:4765b317e7c01170cffbd96b08c639e001ec1e2f317152d1f83a20a5331a3278,
      #   expired false, expires 2026-10-24T10:11:27Z.
      G5A_REFERENCE_RUN_ID: "35985412906"
      G5A_ARTIFACT_NAME: grotli-g5a-ordering-attribution-35985412906
      G5A_ARTIFACT_ID: "10801714249"
      G5A_ARTIFACT_SIZE: "15631"
      G5A_ARTIFACT_DIGEST: "sha256:4765b317e7c01170cffbd96b08c639e001ec1e2f317152d1f83a20a5331a3278"
      # Frozen G5A implementation identity replayed locally as a same-run control.
      G5A_REFERENCE_IMPLEMENTATION_SHA: e6714e81aeff1579c4502f1fd9af4d7f205a8b4b
      G5A_REFERENCE_SOURCE_BLOB: 2772d7eaf0a64be1fdbbb377f5d668d21dab9cbe
      G5A_REFERENCE_PREREG_BLOB: a84f42a3f414cc987d8c19cc70a578e2d4222467
      # Frozen expected backend identity. The runner installs this exact apt version
      # and CI fails closed if the installed version drifts (I5/I8).
      EXPECTED_LIBBROTLI_PACKAGE_VERSION: 1.1.0-2build2
      # Frozen BrotliEncoderVersion() integer (1.1.0 -> 0x01001000).
      EXPECTED_BROTLI_ENCODER_VERSION: "16781312"
      # Exact expected member paths inside the archived G5A artifact zip (no suffix
      # or shallowest matching is accepted; decoy members cannot satisfy a path).
      G5A_REQUIRED_FILES: "results/g5a-ruling.json results/g5a-discovery.jsonl"
      G5A_OPTIONAL_PROVENANCE_FILES: "brotli-package-identity.txt brotli-library-sha256.txt grotli-g5a-implementation-identity.txt grotli-g3-source.blob"
      REPO_SLUG: thelabcorner/anvil
    outputs:
      implementation_sha: ${{ steps.freeze.outputs.sha }}
      classification: ${{ steps.ruling.outputs.classification }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.FROZEN_IMPLEMENTATION_SHA }}
          fetch-depth: 0

      - name: Freeze implementation identity
        id: freeze
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          if [[ "$FROZEN_IMPLEMENTATION_SHA" == PLACEHOLDER_* ]]; then
            echo "FROZEN_IMPLEMENTATION_SHA is still the placeholder." >&2
            echo "Commit the G5B-ORDINAL source first, then pin the real SHA." >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$FROZEN_IMPLEMENTATION_SHA"
          echo "sha=$FROZEN_IMPLEMENTATION_SHA" >> "$GITHUB_OUTPUT"
          test -z "$(git status --porcelain)"
          git show -s --format='%H %s' HEAD
          sha256sum tools/grotli_g5b_ordinal.cpp
          G5B_SOURCE_SHA256="$(sha256sum tools/grotli_g5b_ordinal.cpp | awk '{print $1}')"
          echo "G5B_SOURCE_SHA256=$G5B_SOURCE_SHA256" >> "$GITHUB_OUTPUT"
          echo "G5B_SOURCE_SHA256=$G5B_SOURCE_SHA256" >> "$GITHUB_ENV"
          sha256sum docs/I10-GROTLI-G5B-ORDINAL-PREREG.md | tee grotli-g5b-prereg.sha256
          # Hard blob-identity checks: the checked-out G5B-ORDINAL source and
          # prereg must be exactly the pinned implementation's blobs, so a
          # measurement can never run against drifted sources.
          ACTUAL_SRC_BLOB="$(git rev-parse HEAD:tools/grotli_g5b_ordinal.cpp)"
          ACTUAL_PRE_BLOB="$(git rev-parse HEAD:docs/I10-GROTLI-G5B-ORDINAL-PREREG.md)"
          if [[ "$EXPECTED_G5B_SOURCE_BLOB" == PLACEHOLDER_* || "$EXPECTED_G5B_PREREG_BLOB" == PLACEHOLDER_* ]]; then
            echo "G5B source/prereg blobs are still placeholders." >&2
            exit 1
          fi
          test "$ACTUAL_SRC_BLOB" = "$EXPECTED_G5B_SOURCE_BLOB"
          test "$ACTUAL_PRE_BLOB" = "$EXPECTED_G5B_PREREG_BLOB"
          printf 'source_blob=%s\nprereg_blob=%s\nimplementation_sha=%s\n' \
            "$ACTUAL_SRC_BLOB" "$ACTUAL_PRE_BLOB" "$FROZEN_IMPLEMENTATION_SHA" \
            | tee grotli-g5b-implementation-identity.txt
          uname -a > results-runner.txt

      - name: Install compiler and PINNED frozen backend dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          sudo apt-get update
          # Pin the exact frozen libbrotli apt version when the runner repo exposes
          # it; otherwise fail closed on drift rather than silently accepting it.
          if ! sudo apt-get install -y --no-install-recommends \
                 "libbrotli-dev=${EXPECTED_LIBBROTLI_PACKAGE_VERSION}" \
                 "libbrotli1=${EXPECTED_LIBBROTLI_PACKAGE_VERSION}"; then
            echo "Exact libbrotli ${EXPECTED_LIBBROTLI_PACKAGE_VERSION} is not pinnable from this runner repository." >&2
            echo "Failing closed: silent backend drift is forbidden (I5/I8)." >&2
            exit 1
          fi
          sudo apt-get install -y --no-install-recommends clang-18 python3 time
          clang++-18 --version | tee compiler-identity.txt
          dpkg-query -W -f='${Package}\t${Version}\n' libbrotli1 libbrotli-dev \
            | sort | tee brotli-package-identity.txt
          # Fail closed if the installed libbrotli version differs from the frozen one.
          for pkg in libbrotli1 libbrotli-dev; do
            installed="$(dpkg-query -W -f='${Version}' "$pkg")"
            if [ "$installed" != "$EXPECTED_LIBBROTLI_PACKAGE_VERSION" ]; then
              echo "backend drift: $pkg is $installed, expected $EXPECTED_LIBBROTLI_PACKAGE_VERSION" >&2
              exit 1
            fi
          done

      - name: Materialize and verify frozen G3 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          EXPECTED_BLOB="$(git rev-parse "$FROZEN_G3_SHA:tools/grotli_g3.cpp" 2>/dev/null || true)"
          if [ -z "$EXPECTED_BLOB" ]; then
            echo "Frozen G3 commit not present locally; fetching it explicitly."
            git fetch --no-tags --depth 1 origin "$FROZEN_G3_SHA"
            EXPECTED_BLOB="$(git rev-parse "$FROZEN_G3_SHA:tools/grotli_g3.cpp")"
          fi
          test -n "$EXPECTED_BLOB"
          git show "$FROZEN_G3_SHA:tools/grotli_g3.cpp" > frozen-grotli_g3.cpp
          ACTUAL_BLOB="$(git hash-object frozen-grotli_g3.cpp)"
          WORKTREE_BLOB="$(git hash-object tools/grotli_g3.cpp)"
          test "$ACTUAL_BLOB" = "$EXPECTED_BLOB"
          test "$WORKTREE_BLOB" = "$EXPECTED_BLOB"
          test "$EXPECTED_BLOB" = "$EXPECTED_G3_SOURCE_BLOB"
          ACTUAL_SHA256="$(sha256sum frozen-grotli_g3.cpp | awk '{print $1}')"
          test "$ACTUAL_SHA256" = "$EXPECTED_G3_SOURCE_SHA256"
          printf '%s\n' "$ACTUAL_BLOB" | tee grotli-g3-source.blob
          sha256sum frozen-grotli_g3.cpp | tee grotli-g3-source.sha256
          printf 'frozen_blob=%s\nimplementation_tree_blob=%s\n' \
            "$ACTUAL_BLOB" "$WORKTREE_BLOB" | tee grotli-g3-source-identity.txt

      - name: Build and self-test G5B-ORDINAL against materialized frozen G3 (warning-clean)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          clang++-18 -O3 -DNDEBUG -std=c++20 -Wall -Wextra -Wpedantic -Werror \
            -I. '-DG5B_FROZEN_G3_HEADER="frozen-grotli_g3.cpp"' \
            -MMD -MF grotli-g5b.d -MT grotli_g5b_ordinal \
            tools/grotli_g5b_ordinal.cpp \
            -lbrotlienc -lbrotlidec -lbrotlicommon -o grotli_g5b_ordinal
          grep -Fq 'frozen-grotli_g3.cpp' grotli-g5b.d
          sha256sum grotli_g5b_ordinal | tee grotli-g5b-binary.sha256
          ./grotli_g5b_ordinal selftest
          # I8 additive provenance: hash the actually linked libbrotli .so's and
          # fail closed if any is missing (an empty list must not pass silently).
          ldd grotli_g5b_ordinal | awk '/libbrotli/ {print $3}' \
            | while read -r so; do
                real="$(readlink -f "$so")"
                printf '%s  %s\n' "$(sha256sum "$real" | awk '{print $1}')" "$real"
              done | sort | tee brotli-library-sha256.txt
          test -s brotli-library-sha256.txt
          grep -Fq 'libbrotlienc' brotli-library-sha256.txt
          grep -Fq 'libbrotlidec' brotli-library-sha256.txt
          grep -Fq 'libbrotlicommon' brotli-library-sha256.txt

      - name: Build and self-test separate frozen G3 reference
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          clang++-18 -O3 -DNDEBUG -std=c++20 -Wall -Wextra -Wpedantic \
            frozen-grotli_g3.cpp \
            -lbrotlienc -lbrotlidec -lbrotlicommon -o grotli_g3
          sha256sum grotli_g3 | tee grotli-g3-binary.sha256
          ./grotli_g3 selftest

      - name: Acquire and verify frozen G5A floor evidence (I10)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results floor_evidence
          # Fetch the authoritative archived G5A run + artifact read-only via the
          # GitHub REST API using the workflow GITHUB_TOKEN (actions: read). The
          # worker that froze this experiment did NOT dispatch anything; this step
          # runs only when the operator dispatches the frozen workflow.
          python3 - <<'PY'
          import hashlib, io, json, os, pathlib, urllib.request, zipfile

          repo = os.environ["REPO_SLUG"]
          run_id = os.environ["G5A_REFERENCE_RUN_ID"]
          want_artifact = os.environ["G5A_ARTIFACT_NAME"]
          want_id = os.environ["G5A_ARTIFACT_ID"]
          want_size = int(os.environ["G5A_ARTIFACT_SIZE"])
          want_digest = os.environ["G5A_ARTIFACT_DIGEST"]
          token = os.environ.get("GITHUB_TOKEN", "")
          api = "https://api.github.com"

          def get(url, raw=False):
              req = urllib.request.Request(url)
              req.add_header("Accept", "application/vnd.github+json")
              req.add_header("X-GitHub-Api-Version", "2022-11-28")
              if token:
                  req.add_header("Authorization", f"Bearer {token}")
              return urllib.request.urlopen(req, timeout=300)

          floor = pathlib.Path("floor_evidence")
          floor.mkdir(exist_ok=True)

          # 1. Verify the reference run exists and is the expected run.
          run = json.load(get(f"{api}/repos/{repo}/actions/runs/{run_id}"))
          if str(run["id"]) != run_id:
              raise SystemExit(f"G5A run id mismatch: {run['id']} != {run_id}")
          if run.get("conclusion") != "success":
              raise SystemExit(f"G5A run {run_id} conclusion is {run.get('conclusion')}")
          head_sha = run.get("head_sha", "")
          (floor / "g5a-run.json").write_text(json.dumps(run, indent=2) + "\n")

          # 2. Find the expected artifact by name AND id, verify metadata.
          arts = json.load(get(
              f"{api}/repos/{repo}/actions/runs/{run_id}/artifacts"))["artifacts"]
          match = [a for a in arts if a["name"] == want_artifact]
          if len(match) != 1:
              raise SystemExit(
                  f"G5A artifact {want_artifact}: found {len(match)} matching")
          art = match[0]
          if str(art.get("id")) != want_id:
              raise SystemExit(f"G5A artifact id mismatch: {art.get('id')} != {want_id}")
          if int(art.get("size_in_bytes", -1)) != want_size:
              raise SystemExit(
                  f"G5A artifact size mismatch: {art.get('size_in_bytes')} != {want_size}")
          if art.get("expired"):
              raise SystemExit("G5A reference artifact has expired")
          api_digest = art.get("digest")
          if not api_digest:
              raise SystemExit("G5A artifact has no API digest to verify against")
          if api_digest != want_digest:
              raise SystemExit(
                  f"G5A artifact API digest mismatch: {api_digest} != {want_digest}")
          (floor / "g5a-artifact.json").write_text(json.dumps(art, indent=2) + "\n")

          # 3. Download the artifact zip and verify its digest against the pinned one.
          url = art["archive_download_url"]
          req = urllib.request.Request(url)
          req.add_header("Accept", "application/vnd.github+json")
          if token:
              req.add_header("Authorization", f"Bearer {token}")
          data = urllib.request.urlopen(req, timeout=600).read()
          (floor / "g5a-artifact.zip").write_bytes(data)
          zip_digest = "sha256:" + hashlib.sha256(data).hexdigest()
          (floor / "g5a-artifact.sha256").write_text(
              zip_digest + "  g5a-artifact.zip\n")
          if zip_digest != want_digest:
              raise SystemExit(
                  f"downloaded G5A zip digest mismatch: {zip_digest} != {want_digest}")

          # 4. Extract the required authoritative objects requiring EXACT member
          #    paths (no suffix / shallowest matching: a decoy member cannot satisfy
          #    a required path).
          zf = zipfile.ZipFile(io.BytesIO(data))
          names = set(zf.namelist())
          for rel in os.environ["G5A_REQUIRED_FILES"].split():
              if rel not in names:
                  raise SystemExit(f"G5A artifact missing required exact member {rel}")
              (floor / pathlib.Path(rel).name).write_bytes(zf.read(rel))
          # Verify any provenance files the archive exposes (best effort, recorded).
          for rel in os.environ.get("G5A_OPTIONAL_PROVENANCE_FILES", "").split():
              if rel in names:
                  (floor / pathlib.Path(rel).name).write_bytes(zf.read(rel))

          # 5. Verify frozen provenance facts inside the ruling.
          ruling = json.loads((floor / "g5a-ruling.json").read_text())
          if ruling.get("implementation_sha") != os.environ[
                  "G5A_REFERENCE_IMPLEMENTATION_SHA"]:
              raise SystemExit("G5A ruling implementation_sha mismatch")
          if ruling.get("frozen_g3_sha") != os.environ["FROZEN_G3_SHA"]:
              raise SystemExit("G5A ruling frozen_g3_sha mismatch")
          if ruling.get("classification") != "ORDER-MATERIAL":
              raise SystemExit(
                  f"G5A ruling classification is {ruling.get('classification')}")
          if ruling.get("attribution") != "COLUMN-DOMINANT":
              raise SystemExit(
                  f"G5A ruling attribution is {ruling.get('attribution')}")
          if ruling.get("invariants_ok") is not True:
              raise SystemExit("G5A ruling invariants_ok is not true")
          print("G5A floor provenance verified: run", run_id,
                "head", head_sha, "artifact", want_artifact, "digest", zip_digest)
          PY

      - name: Fetch and verify frozen discovery + known-stress corpora
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p corpus results
          python3 - <<'PY'
          import hashlib, json, os, pathlib, urllib.request

          # D1-D4 frozen discovery objects (immutable since G1; blob SHA-1 and
          # SHA-256 both pinned from the G2 corpus freeze).
          rows = [
              ("D1-amazon-cellphones.ndjson",
               "https://raw.githubusercontent.com/simdjson/simdjson-data/4197c425e857f0ec38e89822fdd0bd9ea21f4daf/jsonexamples/amazon_cellphones.ndjson",
               277673, "9cbb6a071eaa2a10c24d9b4d1729dca501f2f72b",
               "c1518fdaaed45e590c480ed707aa1adaaba8b84b10747f956bd431c708bd590e"),
              ("D2-cdisc-adae.ndjson",
               "https://raw.githubusercontent.com/cdisc-org/DataExchange-DatasetJson/a379f49a3f43c2aaed63bdeca761bdb7140df2c3/examples/adam/adae.ndjson",
               615350, "4bb9ef50f650767967fc3f0a663c73d33c57c608",
               "b795a59c5c92a8fc93d7d3f729fa0dae014e9b0f684a6a7a7bcf07e4104ba723"),
              ("D3-gharchive-10mb.ndjson",
               "https://raw.githubusercontent.com/rushikeshmore/DataCortex/9bf63551499974e7398b87b45d1a9d4b50936566/corpus/json-bench/gharchive-10mb.ndjson",
               10485760, "59d1d00825053e9894a7895fcea0665912524ec8",
               "a860af236f794779b5471b416b2e6d7ea68de00f6d17728dd3b088a7ecec8252"),
              ("D4-crovia-dpi-receipts.ndjson",
               "https://raw.githubusercontent.com/croviatrust/crovia-core/1798a9c9138c6efc3fcaf487ac5e9833008f6ad9/demo_dpi_2025-11/data/dpi_royalty_receipts.ndjson",
               3585053, "24020a024a05a68731a2d4de4536bd7ca3eb8576",
               "0db7ace9e46ce458a7055f48b09aabc7df15f4f74a23553d3660b7de61d0916f"),
              # V1: KNOWN-STRESS anatomy only (G3 already opened it). Not held-out.
              ("V1-sino-us-drugqa-all.jsonl",
               "https://raw.githubusercontent.com/DodgeLU/Sino-US-DrugQA/cd026a27a5e039863de9080b8d7d95acaf1f5a39/data/release/all.jsonl",
               15374047, "8d9e6acf3f534194487532fa60d4f1d43fe71d00",
               "757b9bc7e5ee2d38ab5ed43877b1d87809cb5131621d106671bc27996da1c499"),
          ]
          prov = []
          for name, url, expected_n, expected_blob, expected_sha in rows:
              data = urllib.request.urlopen(url, timeout=300).read()
              if len(data) != expected_n:
                  raise SystemExit(f"{name}: size {len(data)} != {expected_n}")
              blob = hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
              if blob != expected_blob:
                  raise SystemExit(f"{name}: blob {blob} != {expected_blob}")
              sha256 = hashlib.sha256(data).hexdigest()
              if sha256 != expected_sha:
                  raise SystemExit(f"{name}: sha256 {sha256} != {expected_sha}")
              pathlib.Path("corpus", name).write_bytes(data)
              prov.append({"name": name, "bytes": len(data),
                           "git_blob": blob, "sha256": sha256,
                           "role": ("known-stress-not-held-out"
                                    if name.startswith("V1") else "discovery")})
              print(name, len(data), blob, sha256)
          pathlib.Path("results").mkdir(exist_ok=True)
          pathlib.Path("results/discovery-provenance.json").write_text(
              json.dumps({"schema": 1,
                          "implementation_sha": os.environ["FROZEN_IMPLEMENTATION_SHA"],
                          "g5a_floor_run": os.environ["G5A_REFERENCE_RUN_ID"],
                          "frozen_g3_sha": os.environ["FROZEN_G3_SHA"],
                          "files": prov}, indent=2) + "\n"
          )
          PY

      - name: Same-run frozen G5A reference replay on D1-D4 (control gate, I10)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results g5a_replay
          # Materialize and compile the PINNED frozen G5A implementation identity and
          # the frozen G3 source, then run ONLY on the D1-D4 discovery objects after
          # corpus identity verification (the corpora were verified above). This is a
          # control / reproduction gate, NOT a new experiment: it changes no arm,
          # threshold, or corpus. If its A3 facts do not reproduce the archive, the
          # environment has drifted and the run is INVALID-B1-FLOOR (checked below).
          git cat-file -e "$G5A_REFERENCE_IMPLEMENTATION_SHA^{commit}" 2>/dev/null || \
            git fetch --no-tags --depth 1 origin "$G5A_REFERENCE_IMPLEMENTATION_SHA"
          REPLAY_SRC_BLOB="$(git rev-parse "$G5A_REFERENCE_IMPLEMENTATION_SHA:tools/grotli_g5a_ordering.cpp")"
          test "$REPLAY_SRC_BLOB" = "$G5A_REFERENCE_SOURCE_BLOB"
          git show "$G5A_REFERENCE_IMPLEMENTATION_SHA:tools/grotli_g5a_ordering.cpp" \
            > g5a_replay/grotli_g5a_ordering.cpp
          cp frozen-grotli_g3.cpp g5a_replay/frozen-grotli_g3.cpp
          clang++-18 -O3 -DNDEBUG -std=c++20 -Wall -Wextra -Wpedantic -Werror \
            -I. -Ig5a_replay '-DG5A_FROZEN_G3_HEADER="frozen-grotli_g3.cpp"' \
            -MMD -MF g5a_replay/grotli-g5a.d -MT grotli_g5a_ordering \
            g5a_replay/grotli_g5a_ordering.cpp \
            -lbrotlienc -lbrotlidec -lbrotlicommon -o g5a_replay/grotli_g5a_ordering
          grep -Fq 'frozen-grotli_g3.cpp' g5a_replay/grotli-g5a.d
          g5a_replay/grotli_g5a_ordering selftest
          : > results/g5a-replay-discovery.jsonl
          for f in corpus/D*.ndjson; do
            g5a_replay/grotli_g5a_ordering measure "$f" >> results/g5a-replay-discovery.jsonl
          done
          python3 - <<'PY'
          import json, pathlib
          rows = [json.loads(x) for x in
                  pathlib.Path("results/g5a-replay-discovery.jsonl").read_text().splitlines()
                  if x.strip()]
          if len(rows) != 4:
              raise SystemExit(f"expected four G5A replay D1-D4 rows, got {len(rows)}")
          for r in rows:
              if not (r["body_size_identity"] and r["envelope_identity"] and
                      r["invariant_hashes_identical"] and r["all_permutations_exact"] and
                      r["all_mode_pack_unpack"] and r["all_roundtrip"]):
                  raise SystemExit(f"G5A replay invariants failed on {r['file']}")
          print("same-run frozen G5A replay produced four invariant-clean D1-D4 rows")
          PY

      - name: Run G5B-ORDINAL arms on discovery corpus (D1-D4)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          : > results/g5b-discovery.jsonl
          for f in corpus/D*.ndjson; do
            base="$(basename "$f")"
            /usr/bin/time -v -o "results/g5b-$base.time.txt" \
              ./grotli_g5b_ordinal measure "$f" | tee -a results/g5b-discovery.jsonl
          done
          python3 - <<'PY'
          import json, pathlib
          rows = [json.loads(x) for x in
                  pathlib.Path("results/g5b-discovery.jsonl").read_text().splitlines() if x.strip()]
          if len(rows) != 4:
              raise SystemExit(f"expected four D1-D4 rows, got {len(rows)}")
          arm_keys = ("b0_ordinal_null", "b1_ordinal_floor", "b2_ordinal_blocked")
          # Frozen selector bytes: B1/FLOOR == 3, B0/NULL == 4, B2/BLOCKED == 5 (I7).
          want_selector = {"b1_ordinal_floor": 3, "b0_ordinal_null": 4,
                           "b2_ordinal_blocked": 5}
          for r in rows:
              if not (r["body_size_identity"] and r["envelope_len_identity"] and
                      r["token_region_len_identity"] and r["envelope_identity"] and
                      r["invariant_hashes_identical"] and r["all_permutations_exact"] and
                      r["all_mode_pack_unpack"] and r["all_roundtrip"]):
                  raise SystemExit(f"INVALID-G5B-ORDINAL top-level invariants on {r['file']}")
              if r["carrier_quality"] != 11 or r["carrier_window"] != 30:
                  raise SystemExit(f"INVALID-G5B-ORDINAL backend parameters on {r['file']}")
              if not r["brotli_encoder_version"] or not r["brotli_encoder_version_dotted"]:
                  raise SystemExit(f"INVALID-G5B-ORDINAL missing Brotli identity on {r['file']}")
              if "max_slots" not in r or "shared_ordinal_slots" not in r:
                  raise SystemExit(f"INVALID-G5B-ORDINAL missing liveness on {r['file']}")
              if "b1_eq_b2" not in r or "b2_moved_token_count" not in r:
                  raise SystemExit(f"INVALID-G5B-ORDINAL missing degeneracy on {r['file']}")
              # Fail closed on impossible liveness combinations (I11).
              if r["shared_ordinal_slots"] > r["max_slots"]:
                  raise SystemExit(f"INVALID-G5B-ORDINAL shared>max ordinals on {r['file']}")
              if (r["b1_eq_b2"] != (r["b2_moved_token_count"] == 0)):
                  raise SystemExit(f"INVALID-G5B-ORDINAL b1_eq_b2/n_moved contradiction on {r['file']}")
              if bool(r["b1_eq_b2"]) and r["shared_ordinal_slots"] != 0:
                  raise SystemExit(f"INVALID-G5B-ORDINAL degenerate/shared-ordinal contradiction on {r['file']}")
              env_hash = r["envelope_sha256"]
              multiset_hash = r["canonical_token_multiset_sha256"]
              if len(env_hash) != 64 or len(multiset_hash) != 64:
                  raise SystemExit(f"INVALID-G5B-ORDINAL malformed invariant hashes on {r['file']}")
              for key in arm_keys:
                  arm = r[key]
                  if not (arm["roundtrip"] and arm["permutation_ok"] and arm["mode_pack_unpack_ok"]):
                      raise SystemExit(f"INVALID-G5B-ORDINAL {key} correctness on {r['file']}")
                  if arm["mode_byte"] != want_selector[key]:
                      raise SystemExit(f"INVALID-G5B-ORDINAL {key} selector byte on {r['file']}")
                  if arm["envelope_sha256"] != env_hash:
                      raise SystemExit(f"INVALID-G5B-ORDINAL {key} envelope hash on {r['file']}")
                  if arm["canonical_token_multiset_sha256"] != multiset_hash:
                      raise SystemExit(f"INVALID-G5B-ORDINAL {key} multiset hash on {r['file']}")
          for r in rows:
              pathlib.Path("results", f"g5brow-{pathlib.Path(r['file']).name}.json").write_text(
                  json.dumps(r, separators=(",", ":")) + "\n")
          print("four D1-D4 G5B-ORDINAL rows present and invariant-clean")
          PY

      - name: Run G5B-ORDINAL arms on known-stress V1 (diagnostic only)
