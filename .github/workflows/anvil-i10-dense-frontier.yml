          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          from datetime import datetime, timezone

          out = pathlib.Path(os.environ["OUT_DIR"])
          files = []
          for path in sorted(out.rglob("*")):
              if not path.is_file() or path.name in {"manifest.json", "run-status.json"}:
