              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              files.append({"path": str(path.relative_to(out)).replace("\\", "/"), "bytes": path.stat().st_size, "sha256": digest})
          status = {
              "schema": 1,
              "utc": datetime.now(timezone.utc).isoformat(),
              "workflow": os.environ.get("GITHUB_WORKFLOW"),
              "workflow_sha": os.environ.get("GITHUB_SHA"),
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "corpus": os.environ.get("CORPUS"),
              "reps": os.environ.get("REPS"),
              "artifact_file_count": len(files),
              "summary_present": (out / "summary.json").is_file(),
              "pareto_present": (out / "pareto.csv").is_file(),
          }
          (out / "run-status.json").write_text(json.dumps(status, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          manifest = {
              "schema": 1,
              "project": "ANVIL",
              "vehicle": "I10-DENSE-FRONTIER",
              "timing_class": "same-job-paired-shared-runner",
              "github": {key: os.environ.get(value, "") for key, value in {"repository": "GITHUB_REPOSITORY", "sha": "GITHUB_SHA", "ref": "GITHUB_REF", "run_id": "GITHUB_RUN_ID", "run_attempt": "GITHUB_RUN_ATTEMPT", "job": "GITHUB_JOB"}.items()},
              "candidate": {"tag_label": "i10-aux-unbwt-final-v1", "checkout_mode": "immutable-sha", "sha": "0dce534e5df40945d518c9ef4a722f4a0ecfc0e6", "source_blob": "755df76ae53795aea040f4c99784d1effb43b3ab"},
              "tooling": {"sha": "b6a243c9657776058a37e5f0ee2eaae2ff925dff", "paired_bench_blob": "f847c50e38d3b39b61deeb6b21bcf12e9c132fd5", "fetch_corpus_blob": "c8f5cc71f9ade44db3b975d10aad39e901e26ebc"},
              "corpus": os.environ.get("CORPUS"),
              "reps": os.environ.get("REPS"),
              "observation_policy": "generated observe.sh unlinks before every timing invocation",
              "observation_wrapper": "observe.sh",
              "artifacts": files,
          }
          (out / "manifest.json").write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          PY

      - name: Write job summary
        if: ${{ always() }}
        run: |
          set -euo pipefail
          {
            echo '# ANVIL I10 dense frontier'
            echo
            echo "- corpus: \`$CORPUS\`"
            echo "- repetitions: \`$REPS\`"
            echo "- run: \`$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT\`"
            if [ -f "$OUT_DIR/summary.json" ]; then
              cat "$OUT_DIR/summary.json"
            else
              echo 'summary unavailable; inspect partial artifacts'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload complete or partial raw evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: anvil-i10-dense-frontier-${{ inputs.corpus }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.OUT_DIR }}
          if-no-files-found: error
          retention-days: 30
