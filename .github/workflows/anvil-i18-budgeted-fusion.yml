name: ANVIL I18 budget-gated fusion discovery
on: workflow_dispatch
permissions:
  contents: read
jobs:
  discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SOURCE: prototypes/i18-budgeted/i18_budgeted.cpp
      SOURCE_SHA: e5fd1a2c44d697f7cfd49427e1ca3654b192cfff07168e67409007b6f97d65e2
      FUSION: prototypes/i18-budgeted/i16_fusion_frozen.inc
      FUSION_SHA: b214dcff0355293dd588bd762c7328dfce6e114749669f2b7a32d8c052f51dc3
      DECIDER: tools/i18_decide.py
      DECIDER_SHA: 44cfe588fb94d7f05002289cfe1d273a34824722fb65dd440f31cc6a6fb39afe
      I17: prototypes/i17-fast/i17_fast.cpp
      I17_SHA: 727469a41c5506d73f85d0fdc1405f067c1206ad5de94063f1a06605b15c9cf6
      I17_MIRROR: prototypes/i17-fast/i17_fast_entry_renamed.inc
      I17_MIRROR_SHA: dbd0b11cac966a7c5aedf603c3ba7d30b8a4f63b039deb48cebbadbc37d02615
      I16_LEAF: prototypes/i16-envelope/i16_envelope.cpp
      I16_LEAF_SHA: 0162ccfab90607393698e12d410509e3d09e31cf77336139e42a830a4837a418
      I16_MIRROR: prototypes/i17-fast/i16_leaf_renamed.inc
      I16_MIRROR_SHA: 961f218ca14ff3a4bf8e9160eb61afcca82ab087a4a5d62d3166d21d4a0987a3
      I14: prototypes/i14-differential/i14_differential.cpp
      I14_SHA: f4f75b098feee9753084fa5cc132e31064f107fbd8ffa621f5e415b57d825150
      BROTLI_SHA: ed738e842d2fbdf2d6459e39267a633c4a9b2f5d
      BROTLI_SRC: ${{ github.workspace }}/../i18-brotli-source
      BROTLI_BUILD: ${{ github.workspace }}/../i18-brotli-build
      OUT: ${{ github.workspace }}/i18-results
    steps:
      - name: Checkout exactly dispatched source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Attest branch source, frozen leaves and seven preconsumed files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          for var in SOURCE FUSION DECIDER I17 I17_MIRROR I16_LEAF I16_MIRROR I14; do
            path="${!var}"
            hashvar="${var}_SHA"
            printf '%s  %s\n' "${!hashvar}" "$path" | sha256sum -c -
            test "$(git hash-object "$path")" = "$(git rev-parse "HEAD:$path")"
          done
          python3 - <<'PY'
          import pathlib
          import subprocess
          subprocess.run(["git","fetch","-q","--no-tags","origin",
              "9ca860f45d7dad1b617267372e378f18a93f2721"],check=True)
          local=pathlib.Path("prototypes/i18-budgeted/i16_fusion_frozen.inc").read_bytes()
          exact=subprocess.check_output([
              "git","show","9ca860f45d7dad1b617267372e378f18a93f2721:prototypes/i16-fusion/i16_fusion.cpp"
          ])
          assert local==exact, "AVI6 frozen leaf diverged"
          src=pathlib.Path("prototypes/i16-envelope/i16_envelope.cpp").read_bytes()
          mirror=pathlib.Path("prototypes/i17-fast/i16_leaf_renamed.inc").read_bytes()
          before=b"int main(int argc,char** argv)"
          after=b"int i16_frozen_command_main(int argc,char** argv)"
          assert src.count(before)==1 and mirror==src.replace(before,after), "I17 leaf derivation diverged"
          i17=pathlib.Path("prototypes/i17-fast/i17_fast.cpp").read_bytes()
          i17mirror=pathlib.Path("prototypes/i17-fast/i17_fast_entry_renamed.inc").read_bytes()
          i17_after=b"int i17_frozen_command_main(int argc,char** argv)"
          assert i17.count(before)==1 and i17mirror==i17.replace(before,i17_after), "I18 control mirror diverged"
          print("IMMUTABLE_SOURCE_ATTESTATION_PASS")
          PY
          for f in tests/corpus/synth-arith.bin tests/corpus/synth-timeseries.bin tests/corpus/synth-jitter.bin tests/corpus/random.bin tests/corpus/generated.repeat.jsonl tests/corpus/generated.jsonl tests/corpus/src.cpp; do
            test "$(git hash-object "$f")" = "$(git rev-parse "HEAD:$f")"
            case "$f" in
              */synth-arith.bin) expected=af05309f0e1eefb33df71cc444ca56be8d233088378eb4395332f4678d52e16d;;
              */synth-timeseries.bin) expected=1b7d618234f13418959a7dce166d65f1d08c7018fd1e335b7360f07869417425;;
              */synth-jitter.bin) expected=baf543eb4b9d7c6fc3745e71c22748f94497ff632fb710fb97a57dcb74239ac5;;
              */random.bin) expected=0c2a8c337ac53f016f1d4cdf84b75ae80400417fb4767149215ac8d8304aeb02;;
              */generated.repeat.jsonl) expected=b7c90cde3317087cecd40377d65ab81aca3a7a1167c6362b2998a4aa2b677c3e;;
              */generated.jsonl) expected=0a2d1266494a84f97f108e80973544073c04911ba1e30d6d3d3af25b475a201f;;
              */src.cpp) expected=75751176c83f708c9ede9e719c027196af09bfd30b05f576494705f0a928830e;;
            esac
            printf '%s  %s\n' "$expected" "$f" | sha256sum -c -
          done
          test -z "$(git status --porcelain)"
          mkdir -p "$OUT"
          {
            echo "dispatch_commit=$GITHUB_SHA"
            echo "i18_source_sha=$SOURCE_SHA"
            echo "i16_fusion_source_sha=$FUSION_SHA"
            echo "i17_source_sha=$I17_SHA"
            echo "brotli_source_commit=$BROTLI_SHA"
            echo "role=preconsumed-discovery; no novelty or frontier promotion"
            g++ --version | head -n1
            cmake --version | head -n1
            for f in tests/corpus/synth-arith.bin tests/corpus/synth-timeseries.bin tests/corpus/synth-jitter.bin tests/corpus/random.bin tests/corpus/generated.repeat.jsonl tests/corpus/generated.jsonl tests/corpus/src.cpp; do
              echo "$f blob=$(git rev-parse "HEAD:$f") sha256=$(sha256sum "$f" | cut -d' ' -f1)"
            done
          } | tee "$OUT/provenance.txt"
      - name: Build pinned upstream Brotli q5 and q11
        shell: bash
        run: |
          set -euo pipefail
          git init -q "$BROTLI_SRC"
          git -C "$BROTLI_SRC" remote add origin https://github.com/google/brotli.git
          git -C "$BROTLI_SRC" fetch -q --depth 1 origin "$BROTLI_SHA"
          git -C "$BROTLI_SRC" checkout -q --detach FETCH_HEAD
          test "$(git -C "$BROTLI_SRC" rev-parse HEAD)" = "$BROTLI_SHA"
          cmake -S "$BROTLI_SRC" -B "$BROTLI_BUILD" -DCMAKE_BUILD_TYPE=Release -DBROTLI_DISABLE_TESTS=ON -DBUILD_SHARED_LIBS=OFF
          cmake --build "$BROTLI_BUILD" --target brotlienc brotlidec brotlicommon -j 2
      - name: Compile pinned one-binary multi-arm experiment
        shell: bash
        run: |
          set -euo pipefail
          lib() { find "$BROTLI_BUILD" -name "lib$1.a" -print -quit; }
          for n in brotlienc brotlidec brotlicommon; do test -f "$(lib "$n")"; done
          g++ -std=c++20 -O3 -DNDEBUG -Wall -Wextra -Wpedantic -DI12_WITH_BROTLI \
            -I "$BROTLI_SRC/c/include" "$SOURCE" -o "$RUNNER_TEMP/i18" \
            "$(lib brotlienc)" "$(lib brotlidec)" "$(lib brotlicommon)" -pthread
          sha256sum "$RUNNER_TEMP/i18" | tee "$OUT/binary-hashes.txt"
          wc -c "$RUNNER_TEMP/i18" | tee "$OUT/binary-sizes.txt"
      - name: Independent selftests and exhaustive frozen seven-file roundtrips
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/i18" --selftest | tee "$OUT/selftest.txt"
          grep -F "I18_SELFTEST PASS" "$OUT/selftest.txt"
          grep -F "FAST_SELFTEST PASS" "$OUT/selftest.txt"
          for f in tests/corpus/synth-arith.bin tests/corpus/synth-timeseries.bin tests/corpus/synth-jitter.bin tests/corpus/random.bin tests/corpus/generated.repeat.jsonl tests/corpus/generated.jsonl tests/corpus/src.cpp; do
            for profile in budget fast full; do
              "$RUNNER_TEMP/i18" "--encode-$profile" "$f" "$OUT/current.bin"
              if [ "$profile" = budget ]; then decoder=--decode-budget; else decoder=--decode-control; fi
              "$RUNNER_TEMP/i18" "$decoder" "$OUT/current.bin" "$OUT/recovered.bin"
              cmp "$f" "$OUT/recovered.bin"
              echo "ROUNDTRIP_PASS $profile $f" | tee -a "$OUT/roundtrips.txt"
            done
          done
      - name: Paired output-observed seven-input discovery and preregistered decision
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/i18" --bench \
            tests/corpus/synth-arith.bin tests/corpus/synth-timeseries.bin tests/corpus/synth-jitter.bin \
            tests/corpus/random.bin tests/corpus/generated.repeat.jsonl tests/corpus/generated.jsonl \
            tests/corpus/src.cpp | tee "$OUT/benchmark.tsv"
          python3 "$DECIDER" "$OUT/benchmark.tsv" "$OUT/decision.json"
      - name: Isolated one-shot peak RSS samples
        shell: bash
        run: |
          set -euo pipefail
          for f in synth-arith.bin synth-timeseries.bin generated.jsonl; do
            /usr/bin/time -v -o "$OUT/rss-encode-$f.txt" \
              "$RUNNER_TEMP/i18" --encode-budget "tests/corpus/$f" "$OUT/current.bin"
            /usr/bin/time -v -o "$OUT/rss-decode-$f.txt" \
              "$RUNNER_TEMP/i18" --decode-budget "$OUT/current.bin" "$OUT/recovered.bin"
            cmp "tests/corpus/$f" "$OUT/recovered.bin"
          done
      - name: Always retain full source-attested evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: anvil-i18-${{ github.sha }}-run${{ github.run_attempt }}
          path: ${{ env.OUT }}
          if-no-files-found: warn
          retention-days: 90
