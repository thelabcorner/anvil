name: ANVIL I10 Grotli G1 shape ceiling

on:
  workflow_dispatch:

concurrency:
  group: anvil-i10-grotli-g1
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      implementation_sha: ${{ steps.freeze.outputs.sha }}
      pass_discovery: ${{ steps.ruling.outputs.pass_discovery }}

    steps:
      - uses: actions/checkout@v4

      - name: Freeze implementation identity
        id: freeze
        shell: bash
        run: |
          echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          test -z "$(git status --porcelain)"
          git rev-parse HEAD

      - name: Install compiler and Brotli
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-18 libbrotli-dev python3 time

      - name: Build frozen standalone G1 prototype
        run: |
          clang++-18 -O3 -DNDEBUG -std=c++20 -Wall -Wextra -Wpedantic \
            tools/grotli_g1.cpp \
            -lbrotlienc -lbrotlidec -lbrotlicommon -o grotli_g1
          sha256sum grotli_g1 | tee grotli-g1-binary.sha256

      - name: Parser, roundtrip, and malformed-wire self-test
        run: ./grotli_g1 selftest

      - name: Fetch and verify frozen discovery corpora
        shell: bash
        run: |
          mkdir -p corpus results
          python3 - <<'PY'
          import hashlib, json, os, pathlib, urllib.request

          rows = [
              {
                  "name": "D1-amazon-cellphones.ndjson",
                  "url": "https://raw.githubusercontent.com/simdjson/simdjson-data/4197c425e857f0ec38e89822fdd0bd9ea21f4daf/jsonexamples/amazon_cellphones.ndjson",
                  "bytes": 277673,
                  "blob": "9cbb6a071eaa2a10c24d9b4d1729dca501f2f72b",
              },
              {
                  "name": "D2-cdisc-adae.ndjson",
                  "url": "https://raw.githubusercontent.com/cdisc-org/DataExchange-DatasetJson/a379f49a3f43c2aaed63bdeca761bdb7140df2c3/examples/adam/adae.ndjson",
                  "bytes": 615350,
                  "blob": "4bb9ef50f650767967fc3f0a663c73d33c57c608",
              },
              {
                  "name": "D3-gharchive-10mb.ndjson",
                  "url": "https://raw.githubusercontent.com/rushikeshmore/DataCortex/9bf63551499974e7398b87b45d1a9d4b50936566/corpus/json-bench/gharchive-10mb.ndjson",
                  "bytes": 10485760,
                  "blob": "59d1d00825053e9894a7895fcea0665912524ec8",
              },
              {
                  "name": "D4-crovia-dpi-receipts.ndjson",
                  "url": "https://raw.githubusercontent.com/croviatrust/crovia-core/1798a9c9138c6efc3fcaf487ac5e9833008f6ad9/demo_dpi_2025-11/data/dpi_royalty_receipts.ndjson",
                  "bytes": 3585053,
                  "blob": "24020a024a05a68731a2d4de4536bd7ca3eb8576",
              },
          ]

          prov = []
          for row in rows:
              data = urllib.request.urlopen(row["url"], timeout=180).read()
              if len(data) != row["bytes"]:
                  raise SystemExit(f"{row['name']}: size {len(data)} != {row['bytes']}")
              blob = hashlib.sha1(
                  b"blob " + str(len(data)).encode() + b"\0" + data
              ).hexdigest()
              if blob != row["blob"]:
                  raise SystemExit(f"{row['name']}: blob {blob} != {row['blob']}")
              sha256 = hashlib.sha256(data).hexdigest()
              pathlib.Path("corpus", row["name"]).write_bytes(data)
              prov.append({
                  "name": row["name"],
                  "bytes": len(data),
                  "git_blob": blob,
                  "sha256": sha256,
              })
              print(row["name"], len(data), blob, sha256)

          pathlib.Path("results/discovery-provenance.json").write_text(
              json.dumps({
                  "schema": 1,
                  "implementation_sha": os.environ["GITHUB_SHA"],
                  "files": prov,
              }, indent=2) + "\n"
          )
          PY

      - name: Measure frozen discovery arms
        shell: bash
        run: |
          set -euo pipefail
          : > results/discovery.jsonl
          for f in corpus/*; do
            base="$(basename "$f")"
            /usr/bin/time -v -o "results/$base.time.txt" \
              ./grotli_g1 measure "$f" | tee -a results/discovery.jsonl
          done

      - name: Discovery ruling
        id: ruling
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, pathlib

          rows = [
              json.loads(x)
              for x in pathlib.Path("results/discovery.jsonl").read_text().splitlines()
              if x.strip()
          ]
          if len(rows) != 4:
              raise SystemExit(f"expected four discovery rows, got {len(rows)}")

          wins_5 = 0
          raw_total = 0
          selected_total = 0
          report_rows = []

          for r in rows:
              if not r.get("structured_eligible"):
                  raise SystemExit(
                      f"frozen discovery corpus unexpectedly ineligible: "
                      f"{r['file']}: {r.get('ineligible_reason')}"
                  )
              if not (
                  r.get("raw_roundtrip")
                  and r.get("row_roundtrip")
                  and r.get("column_roundtrip")
              ):
                  raise SystemExit(f"roundtrip failed: {r['file']}")

              best_structured = min(
                  r["row_complete_bytes"], r["column_complete_bytes"]
              )
              structured_delta = (
                  best_structured / r["raw_complete_bytes"] - 1.0
              ) * 100.0
              if structured_delta <= -5.0:
                  wins_5 += 1
              raw_total += r["raw_complete_bytes"]
              selected_total += r["selected_bytes"]
              report_rows.append({
                  "file": r["file"],
                  "source_bytes": r["source_bytes"],
                  "raw_complete_bytes": r["raw_complete_bytes"],
                  "row_complete_bytes": r["row_complete_bytes"],
                  "column_complete_bytes": r["column_complete_bytes"],
                  "best_structured_delta_pct": structured_delta,
                  "selected_arm": r["selected_arm"],
                  "selected_bytes": r["selected_bytes"],
                  "shape_count": r["shape_count"],
                  "record_count": r["record_count"],
                  "singleton_shape_count": r["singleton_shape_count"],
                  "gross_template_bytes_avoided": r["gross_template_bytes_avoided"],
              })

          aggregate_delta = (selected_total / raw_total - 1.0) * 100.0
          passed = wins_5 >= 2 and aggregate_delta <= -3.0

          ruling = {
              "schema": 1,
              "implementation_sha": os.environ["GITHUB_SHA"],
              "wins_ge_5pct": wins_5,
              "required_wins_ge_5pct": 2,
              "aggregate_raw_complete_bytes": raw_total,
              "aggregate_selected_bytes": selected_total,
              "aggregate_selected_delta_pct": aggregate_delta,
              "required_aggregate_delta_pct": -3.0,
              "pass_discovery": passed,
              "rows": report_rows,
          }
          pathlib.Path("results/discovery-ruling.json").write_text(
              json.dumps(ruling, indent=2) + "\n"
          )
          pathlib.Path("results/discovery-ruling.md").write_text(
              "# G1 discovery ruling\n\n"
              f"- >=5% structured wins: **{wins_5}/4** (need 2)\n"
              f"- aggregate selected delta: **{aggregate_delta:.4f}%** "
              "(need <= -3%)\n"
              f"- ruling: **{'PASS-G1-DISCOVERY' if passed else 'NO-GO-G1-DISCOVERY'}**\n"
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"pass_discovery={'true' if passed else 'false'}\n")
          print(json.dumps(ruling, indent=2))
          PY
          cat results/discovery-ruling.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload discovery evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: grotli-g1-discovery-${{ github.run_id }}
          path: |
            results/
            grotli-g1-binary.sha256
          if-no-files-found: error
          retention-days: 30

  validation:
    needs: discovery
    if: needs.discovery.outputs.pass_discovery == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      IMPLEMENTATION_SHA: ${{ needs.discovery.outputs.implementation_sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.discovery.outputs.implementation_sha }}

      - name: Verify frozen implementation identity
        run: test "$(git rev-parse HEAD)" = "$IMPLEMENTATION_SHA"

      - name: Install compiler and Brotli
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-18 libbrotli-dev python3 time

      - name: Build and self-test identical G1 implementation
        run: |
          clang++-18 -O3 -DNDEBUG -std=c++20 -Wall -Wextra -Wpedantic \
            tools/grotli_g1.cpp \
            -lbrotlienc -lbrotlidec -lbrotlicommon -o grotli_g1
          ./grotli_g1 selftest
          sha256sum grotli_g1 | tee grotli-g1-binary.sha256

      - name: Fetch and verify held-out V1
        shell: bash
        run: |
          mkdir -p corpus results
          python3 - <<'PY'
          import hashlib, json, os, pathlib, urllib.request

          name = "V1-sino-us-drugqa-all.jsonl"
          url = "https://raw.githubusercontent.com/DodgeLU/Sino-US-DrugQA/cd026a27a5e039863de9080b8d7d95acaf1f5a39/data/release/all.jsonl"
          expected_n = 15374047
          expected_blob = "8d9e6acf3f534194487532fa60d4f1d43fe71d00"

          data = urllib.request.urlopen(url, timeout=240).read()
          if len(data) != expected_n:
              raise SystemExit(f"{name}: size {len(data)} != {expected_n}")
          blob = hashlib.sha1(
              b"blob " + str(len(data)).encode() + b"\0" + data
          ).hexdigest()
          if blob != expected_blob:
              raise SystemExit(f"{name}: blob {blob} != {expected_blob}")

          sha256 = hashlib.sha256(data).hexdigest()
          pathlib.Path("corpus", name).write_bytes(data)
          pathlib.Path("results/validation-provenance.json").write_text(
              json.dumps({
                  "schema": 1,
                  "name": name,
                  "bytes": len(data),
                  "git_blob": blob,
                  "sha256": sha256,
                  "implementation_sha": os.environ["IMPLEMENTATION_SHA"],
              }, indent=2) + "\n"
          )
          print(name, len(data), blob, sha256)
          PY

      - name: Measure held-out frozen arms
        shell: bash
        run: |
          /usr/bin/time -v -o results/V1.time.txt \
            ./grotli_g1 measure corpus/V1-sino-us-drugqa-all.jsonl \
            | tee results/validation.jsonl

      - name: Held-out ruling
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, pathlib

          r = json.loads(pathlib.Path("results/validation.jsonl").read_text())
          if not r.get("structured_eligible"):
              raise SystemExit(
                  f"held-out corpus unexpectedly ineligible: "
                  f"{r.get('ineligible_reason')}"
              )
          if not (
              r.get("raw_roundtrip")
              and r.get("row_roundtrip")
              and r.get("column_roundtrip")
          ):
              raise SystemExit("held-out roundtrip failed")

          delta = r["selected_delta_pct"]
          passed = delta <= -1.0
          ruling = {
              "schema": 1,
              "implementation_sha": os.environ["IMPLEMENTATION_SHA"],
              "selected_arm": r["selected_arm"],
              "raw_complete_bytes": r["raw_complete_bytes"],
              "selected_bytes": r["selected_bytes"],
              "selected_delta_pct": delta,
              "required_delta_pct": -1.0,
              "pass_g1_base": passed,
              "ruling": "PASS-G1-BASE" if passed else "PASS-G1-NARROW",
          }
          pathlib.Path("results/validation-ruling.json").write_text(
              json.dumps(ruling, indent=2) + "\n"
          )
          pathlib.Path("results/validation-ruling.md").write_text(
              "# G1 held-out ruling\n\n"
              f"- selected arm: **{r['selected_arm']}**\n"
              f"- selected delta: **{delta:.4f}%** (need <= -1%)\n"
              f"- ruling: **{ruling['ruling']}**\n"
          )
          print(json.dumps(ruling, indent=2))
          PY
          cat results/validation-ruling.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload held-out evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: grotli-g1-validation-${{ github.run_id }}
          path: |
            results/
            grotli-g1-binary.sha256
          if-no-files-found: error
          retention-days: 30
