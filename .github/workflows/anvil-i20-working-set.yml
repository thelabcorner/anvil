name: ANVIL I20-W4 decode working set

# C4 (I20 worker W4): decode working-set engineering at ZERO wire cost.
#
# This workflow is the evidence producer for the C4 arm:
#   * byte identity of the changed binary against the frozen I10-1A bytes
#     (--bwt-aux=on AND --bwt-aux=off) on every corpus file;
#   * per-FILE peak decode RSS for the FROZEN baseline binary and for the
#     changed binary, measured on the SAME payloads in the SAME job
#     (/usr/bin/time -f %M, the same measurement the repo arbiter uses);
#   * the same table as a function of the BWT sub-block cap, so the
#     coordinator can compose C4 with C3;
#   * a same-job paired decode-time comparison (changed vs frozen) with an
#     A/A null pair;
#   * the repo fuzz / registry path on the changed binary.
#
# The change under test is DECODE-ONLY: the encoder is untouched, so the
# expected compressed totals are the frozen ones (Silesia 46,466,339 B /
# enwik8 23,537,422 B with --bwt-aux=on, and 46,446,995 B / 23,534,368 B
# with --bwt-aux=off).
#
# This workflow never selects a representation and never rewrites the arbiter:
# tools/reference_cost_gate.py is used unmodified for the byte totals, and
# tools/i20_working_set.py only measures and models.
on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: 'Git ref to build as the ANVIL candidate (branch, tag or SHA)'
        required: true
        default: 'research/anvil-i20-w4-working-set'
      baseline_ref:
        description: 'Frozen baseline ref to build as the control arm'
        required: true
        default: 'i10-aux-unbwt-final-v1'
      reps:
        description: Paired decode repetitions
        required: true
        default: '9'
        type: choice
        options:
          - '7'
          - '9'
          - '13'
      cap_mib:
        description: 'BWT sub-block caps (MiB) for the diagnostic cap sweep'
        required: true
        default: '16,8,4'
      expect_silesia_aux_on:
        description: 'Expected Silesia total bytes with --bwt-aux=on'
        required: true
        default: '46466339'
      expect_silesia_aux_off:
        description: 'Expected Silesia total bytes with --bwt-aux=off'
        required: true
        default: '46446995'
      expect_enwik8_aux_on:
        description: 'Expected enwik8 total bytes with --bwt-aux=on'
        required: true
        default: '23537422'
      expect_enwik8_aux_off:
        description: 'Expected enwik8 total bytes with --bwt-aux=off'
        required: true
        default: '23534368'

concurrency:
  group: anvil-i20-working-set
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  working-set:
    strategy:
      fail-fast: false
      matrix:
        corpus:
          - silesia
          - enwik8

    runs-on: ubuntu-24.04
    timeout-minutes: 180

    env:
      CORPUS_ROOT: ${{ github.workspace }}/corpora
      OUT_DIR: ${{ github.workspace }}/i20-w4-${{ matrix.corpus }}
      CANDIDATE_REF: ${{ inputs.candidate_ref }}
      BASELINE_REF: ${{ inputs.baseline_ref }}

    steps:
      - name: Checkout measurement tooling
        uses: actions/checkout@v4
        with:
          path: tooling

      - name: Checkout frozen baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BASELINE_REF }}
          path: baseline

      - name: Checkout candidate source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_REF }}
          path: candidate

      - name: Install pinned dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-18 cmake ninja-build libbrotli-dev libzstd-dev \
            xz-utils time python3 valgrind

      - name: Fingerprint runner, source and arms
        run: |
          mkdir -p "$OUT_DIR"
          {
            echo "utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "workflow_sha=${GITHUB_SHA}"
            echo "workflow_ref=${GITHUB_REF}"
            echo "candidate_ref=$CANDIDATE_REF"
            echo "candidate_sha=$(git -C candidate rev-parse HEAD)"
            echo "candidate_src_sha256=$(sha256sum candidate/src/anvil.cpp | cut -d' ' -f1)"
            echo "baseline_ref=$BASELINE_REF"
            echo "baseline_sha=$(git -C baseline rev-parse HEAD)"
            echo "baseline_src_sha256=$(sha256sum baseline/src/anvil.cpp | cut -d' ' -f1)"
            echo "tooling_sha=$(git -C tooling rev-parse HEAD)"
            echo "tooling_working_set_sha256=$(sha256sum tooling/tools/i20_working_set.py | cut -d' ' -f1)"
            echo "tooling_reference_gate_sha256=$(sha256sum tooling/tools/reference_cost_gate.py | cut -d' ' -f1)"
            echo "reps=${{ inputs.reps }}"
            echo "cap_mib=${{ inputs.cap_mib }}"
            uname -a
            lscpu
            clang-18 --version
            cmake --version
            ninja --version
            xz --version
            valgrind --version
            dpkg-query -W -f='brotli-dev=${Version}\n' libbrotli-dev
          } | tee "$OUT_DIR/provenance.txt"
          printf '%s\n' "$CANDIDATE_REF" > "$OUT_DIR/candidate-ref.txt"
          printf '%s\n' "$BASELINE_REF" > "$OUT_DIR/baseline-ref.txt"

      - name: Build baseline and candidate
        run: |
          cmake -S baseline -B baseline/build-w4 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DANVIL_BUILD_NATIVE_BENCH=OFF
          cmake --build baseline/build-w4 --parallel 4 --target anvil
          cmake -S candidate -B candidate/build-w4 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DANVIL_BUILD_NATIVE_BENCH=OFF
          cmake --build candidate/build-w4 --parallel 4 --target anvil
          sha256sum baseline/build-w4/anvil candidate/build-w4/anvil \
            | tee "$OUT_DIR/binary-sha256.txt"

      - name: Fetch canonical corpus
        run: |
          python3 tooling/tools/gha_fetch_corpus.py \
            "${{ matrix.corpus }}" \
            --out "$CORPUS_ROOT"

      - name: Encode canonical payloads and check byte identity
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, sys
          from datetime import datetime, timezone

          out = pathlib.Path(os.environ["OUT_DIR"])
          root = pathlib.Path(os.environ["CORPUS_ROOT"])
          cand = pathlib.Path("candidate/build-w4/anvil").resolve()
          corpus = os.environ.get("MATRIX_CORPUS", "")

          if corpus == "enwik8":
              files = [root / "enwik8" / "enwik8"]
          else:
              d = root / "silesia"
              files = [d / n for n in [
                  "dickens", "mozilla", "mr", "nci", "ooffice", "osdb",
                  "reymont", "samba", "sao", "webster", "x-ray", "xml",
              ]]

          def sha256(p):
              h = hashlib.sha256()
              with open(p, "rb") as f:
                  for b in iter(lambda: f.read(1 << 20), b""):
                      h.update(b)
              return h.hexdigest()

          def encode(src, dst, aux):
              cmd = [str(cand), "c", str(src), str(dst),
                     "--parse=ratio", "--ratio-backend=auto",
                     "--ratio-context=off", "--ratio-lines=off",
                     f"--bwt-aux={aux}", "--quiet"]
              p = subprocess.run(cmd, stderr=subprocess.PIPE)
              if p.returncode:
                  raise SystemExit(f"encode failed rc={p.returncode}: {p.stderr.decode()[-2000:]}")

          rows = []
          for aux in ("on", "off"):
              d = out / "packed" / f"aux-{aux}"
              d.mkdir(parents=True, exist_ok=True)
              for src in files:
                  dst = d / f"{src.name}.anv"
                  encode(src, dst, aux)
                  rows.append({
                      "corpus": corpus, "file": src.name, "bwt_aux": aux,
                      "input_bytes": src.stat().st_size,
                      "source_sha256": sha256(src),
                      "compressed_bytes": dst.stat().st_size,
                      "payload_sha256": sha256(dst),
                  })
              total = sum(r["compressed_bytes"] for r in rows if r["bwt_aux"] == aux)
              print(f"aux={aux} total={total}", flush=True)

          import csv
          with (out / "bytes.csv").open("w", newline="", encoding="utf-8") as f:
              w = csv.DictWriter(f, fieldnames=list(rows[0].keys()))
              w.writeheader()
              w.writerows(rows)

          expect = {
              ("silesia", "on"): int(os.environ.get("EXPECT_SILESIA_AUX_ON", "0")),
              ("silesia", "off"): int(os.environ.get("EXPECT_SILESIA_AUX_OFF", "0")),
              ("enwik8", "on"): int(os.environ.get("EXPECT_ENWIK8_AUX_ON", "0")),
              ("enwik8", "off"): int(os.environ.get("EXPECT_ENWIK8_AUX_OFF", "0")),
          }
          report = {"utc": datetime.now(timezone.utc).isoformat(), "totals": {}}
          ok = True
          for aux in ("on", "off"):
              total = sum(r["compressed_bytes"] for r in rows if r["bwt_aux"] == aux)
              want = expect.get((corpus, aux), 0)
              report["totals"][f"aux-{aux}"] = {
                  "got": total, "expected": want,
                  "match": (want == 0 or want == total),
              }
              if want and want != total:
                  ok = False
          (out / "byte-identity.json").write_text(json.dumps(report, indent=2, sort_keys=True) + "\n")
          print(json.dumps(report, indent=2, sort_keys=True))
          if not ok:
              raise SystemExit("BYTE IDENTITY FAILED")
          PY
        env:
          MATRIX_CORPUS: ${{ matrix.corpus }}
          EXPECT_SILESIA_AUX_ON: ${{ inputs.expect_silesia_aux_on }}
          EXPECT_SILESIA_AUX_OFF: ${{ inputs.expect_silesia_aux_off }}
          EXPECT_ENWIK8_AUX_ON: ${{ inputs.expect_enwik8_aux_on }}
          EXPECT_ENWIK8_AUX_OFF: ${{ inputs.expect_enwik8_aux_off }}

      - name: Round-trip byte-exactness on every corpus file
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          out = pathlib.Path(os.environ["OUT_DIR"])
          root = pathlib.Path(os.environ["CORPUS_ROOT"])
          cand = pathlib.Path("candidate/build-w4/anvil").resolve()
          base = pathlib.Path("baseline/build-w4/anvil").resolve()
          if os.environ.get("MATRIX_CORPUS") == "enwik8":
              files = [root / "enwik8" / "enwik8"]
          else:
              d = root / "silesia"
              files = [d / n for n in [
                  "dickens", "mozilla", "mr", "nci", "ooffice", "osdb",
                  "reymont", "samba", "sao", "webster", "x-ray", "xml",
              ]]
          def sha256(p):
              h = hashlib.sha256()
              with open(p, "rb") as f:
                  for b in iter(lambda: f.read(1 << 20), b""):
                      h.update(b)
              return h.hexdigest()
          rows = []
          bad = 0
          for aux in ("on", "off"):
              for src in files:
                  payload = out / "packed" / f"aux-{aux}" / f"{src.name}.anv"
                  for arm, exe in (("candidate", cand), ("baseline", base)):
                      dec = out / "rt" / aux / arm / src.name
                      dec.parent.mkdir(parents=True, exist_ok=True)
                      p = subprocess.run([str(exe), "d", str(payload), str(dec), "--quiet"],
                                         stderr=subprocess.PIPE)
                      if p.returncode:
                          raise SystemExit(f"decode failed {arm} {aux} {src.name}: {p.stderr.decode()[-2000:]}")
                      got, want = sha256(dec), sha256(src)
                      same = (got == want)
                      if not same:
                          bad += 1
                      rows.append({"corpus": os.environ.get("MATRIX_CORPUS", ""), "file": src.name,
                                   "bwt_aux": aux, "arm": arm, "bytes": dec.stat().st_size,
                                   "sha256": got, "matches_source": same})
          import csv
          with (out / "roundtrip.csv").open("w", newline="", encoding="utf-8") as f:
              w = csv.DictWriter(f, fieldnames=list(rows[0].keys()))
              w.writeheader()
              w.writerows(rows)
          print(f"roundtrip rows={len(rows)} mismatches={bad}")
          if bad:
              raise SystemExit("ROUND-TRIP MISMATCH")
          PY
        env:
          MATRIX_CORPUS: ${{ matrix.corpus }}

      - name: Build decode command manifests
        run: |
          python3 tooling/tools/i20_working_set.py manifest \
            --corpus "${{ matrix.corpus }}" \
            --root "$CORPUS_ROOT" \
            --payload-dir "$OUT_DIR/packed/aux-on" \
            --baseline baseline/build-w4/anvil \
            --candidate candidate/build-w4/anvil \
            --out "$OUT_DIR"

      - name: Measure per-file peak decode RSS (baseline vs candidate, default cap)
        run: |
          python3 tooling/tools/i20_working_set.py rss \
            --manifest "$OUT_DIR/${{ matrix.corpus }}-baseline-commands.json" \
            --manifest "$OUT_DIR/${{ matrix.corpus }}-candidate-commands.json" \
            --out "$OUT_DIR"

      - name: Diagnostic sub-block cap sweep (bytes + RSS at each cap)
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          out = pathlib.Path(os.environ["OUT_DIR"])
          root = pathlib.Path(os.environ["CORPUS_ROOT"])
          cand = pathlib.Path("candidate/build-w4/anvil").resolve()
          corpus = os.environ.get("MATRIX_CORPUS", "")
          caps = [int(x) * 1024 * 1024 for x in os.environ.get("CAP_MIB", "16,4").split(",") if x]
          if corpus == "enwik8":
              files = [root / "enwik8" / "enwik8"]
          else:
              # the three largest Silesia files: they set the portfolio peak
              files = [root / "silesia" / n for n in ("mozilla", "webster", "nci")]
          rows = []
          for cap in caps:
              d = out / "packed" / f"cap-{cap}"
              d.mkdir(parents=True, exist_ok=True)
              for src in files:
                  dst = d / f"{src.name}.anv"
                  cmd = [str(cand), "c", str(src), str(dst), "--parse=ratio",
                         "--ratio-backend=auto", "--ratio-context=off", "--ratio-lines=off",
                         "--bwt-aux=on", f"--bwt-subblock={cap}", "--quiet"]
                  p = subprocess.run(cmd, stderr=subprocess.PIPE)
                  if p.returncode:
                      raise SystemExit(f"cap encode failed {cap} {src.name}: {p.stderr.decode()[-2000:]}")
                  rows.append({"corpus": corpus, "file": src.name, "cap": cap,
                               "input_bytes": src.stat().st_size,
                               "compressed_bytes": dst.stat().st_size})
                  print(f"cap={cap} file={src.name} bytes={dst.stat().st_size}", flush=True)
          import csv
          with (out / "cap-bytes.csv").open("w", newline="", encoding="utf-8") as f:
              w = csv.DictWriter(f, fieldnames=list(rows[0].keys()))
              w.writeheader()
              w.writerows(rows)
          # manifests for the capped payloads, for the RSS arm
          for arm, exe in (("baseline", "baseline/build-w4/anvil"), ("candidate", "candidate/build-w4/anvil")):
              for cap in caps:
                  d = out / "packed" / f"cap-{cap}"
                  commands, outputs, names = [], [], []
                  for src in files:
                      payload = d / f"{src.name}.anv"
                      dec = out / f"decoded-cap{cap}" / arm / src.name
                      dec.parent.mkdir(parents=True, exist_ok=True)
                      commands.append([str(pathlib.Path(exe).resolve()), "d", str(payload), str(dec), "--quiet"])
                      outputs.append(str(dec)); names.append(src.name)
                  (out / f"cap{cap}-{arm}-commands.json").write_text(json.dumps(
                      {"schema": 1, "arm": f"{arm}-cap{cap}", "corpus": corpus,
                       "files": names, "commands": commands, "outputs": outputs}, indent=2) + "\n")
          PY
        env:
          MATRIX_CORPUS: ${{ matrix.corpus }}
          CAP_MIB: ${{ inputs.cap_mib }}

      - name: Measure per-file peak decode RSS at each sub-block cap
        run: |
          set -euo pipefail
          ARGS=()
          for m in "$OUT_DIR"/cap*-commands.json; do
            [ -e "$m" ] || continue
            ARGS+=(--manifest "$m")
          done
          if [ ${#ARGS[@]} -eq 0 ]; then
            echo "no cap manifests built; skipping cap RSS"
            exit 0
          fi
          python3 tooling/tools/i20_working_set.py rss "${ARGS[@]}" --out "$OUT_DIR/cap-rss"

      - name: In-place inverse-BWT equivalence proof on real corpus data
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR/prototype"
          clang -O2 -DNDEBUG -std=c11 -I candidate/third_party/libsais/include \
            -c candidate/third_party/libsais/src/libsais.c -o "$OUT_DIR/prototype/libsais.o"
          clang++ -O2 -std=c++17 -I candidate/third_party/libsais/include \
            candidate/prototypes/i20-working-set/inplace_unbwt.cpp \
            "$OUT_DIR/prototype/libsais.o" -o "$OUT_DIR/prototype/inplace_unbwt"
          if [ "${{ matrix.corpus }}" = "enwik8" ]; then
            FILES=("$CORPUS_ROOT/enwik8/enwik8")
          else
            FILES=("$CORPUS_ROOT/silesia/mozilla" "$CORPUS_ROOT/silesia/webster" \
                   "$CORPUS_ROOT/silesia/nci" "$CORPUS_ROOT/silesia/samba" \
                   "$CORPUS_ROOT/silesia/xml" "$CORPUS_ROOT/silesia/dickens")
          fi
          "$OUT_DIR/prototype/inplace_unbwt" "${FILES[@]}" \
            | tee "$OUT_DIR/prototype/inplace_unbwt.txt"

      - name: Heap-peak attribution by allocation site (valgrind massif)
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR/massif"
          if [ "${{ matrix.corpus }}" = "silesia" ]; then
            SRC="$CORPUS_ROOT/silesia/dickens"
          else
            SRC="$CORPUS_ROOT/enwik8/enwik8"
          fi
          PAYLOAD="$OUT_DIR/packed/aux-on/$(basename "$SRC").anv"
          for ARM in baseline candidate; do
            if [ "$ARM" = "baseline" ]; then EXE=baseline/build-w4/anvil; else EXE=candidate/build-w4/anvil; fi
            timeout 1200 valgrind --tool=massif --massif-out-file="$OUT_DIR/massif/$ARM.massif" \
              --detailed-freq=1 --max-snapshots=200 \
              "$EXE" d "$PAYLOAD" "$OUT_DIR/massif/$ARM.out" --quiet || true
            if [ -f "$OUT_DIR/massif/$ARM.massif" ]; then
              ms_print "$OUT_DIR/massif/$ARM.massif" > "$OUT_DIR/massif/$ARM.txt" || true
            fi
          done
          ls -la "$OUT_DIR/massif" | tee "$OUT_DIR/massif/listing.txt"

      - name: Paired decode timing (changed vs frozen) with A/A null
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess, sys
          out = pathlib.Path(os.environ["OUT_DIR"])
          driver = pathlib.Path("tooling/tools/paired_bench.py")
          reps = os.environ.get("REPS", "9")
          base = ["bash", str(out / "decode-baseline.sh")]
          cand = ["bash", str(out / "decode-candidate.sh")]
          for name, control, candidate in (("null", base, base), ("changed", base, cand)):
              cmd = [sys.executable, str(driver),
                     "--control-json", json.dumps(control),
                     "--candidate-json", json.dumps(candidate),
                     "--reps", reps, "--warmups", "2", "--seed", "41246",
                     "--bootstrap", "20000", "--epsilon", "0.02", "--max-cv", "0.15",
                     "--cpu", "0", "--ambient-reps", "5", "--ambient-iterations", "250000",
                     "--ambient-max-cv", "0.10",
                     "--out", str(out / f"paired-{name}.csv"),
                     "--summary", str(out / f"paired-{name}.json"),
                     "--stdout-dir", str(out / f"stdout-{name}")]
              print("RUN", name, flush=True)
              subprocess.run(cmd, check=True)
          PY
        env:
          REPS: ${{ inputs.reps }}

      - name: Theoretical peak-floor model and composable table
        run: |
          set -euo pipefail
          python3 tooling/tools/i20_working_set.py model \
            --bytes-csv "$OUT_DIR/bytes.csv" \
            --cap-bytes-csv "$OUT_DIR/cap-bytes.csv" \
            --codec anvil-aux \
            --caps "none,16M,8M,4M" \
            --out "$OUT_DIR"
          RSS_ARGS=()
          for c in "$OUT_DIR/rss-by-file.csv" "$OUT_DIR/cap-rss/rss-by-file.csv"; do
            [ -f "$c" ] && RSS_ARGS+=(--rss-csv "$c")
          done
          if [ ${#RSS_ARGS[@]} -gt 0 ]; then
            python3 tooling/tools/i20_working_set.py report \
              --bytes-csv "$OUT_DIR/bytes.csv" \
              --cap-bytes-csv "$OUT_DIR/cap-bytes.csv" \
              "${RSS_ARGS[@]}" \
              --codec anvil-aux \
              --caps "none,16M,8M,4M" \
              --xz-mib 54.3 --brotli-mib 124.5 \
              --out "$OUT_DIR"
            cat "$OUT_DIR/composable-peak-table.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload raw working-set evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: anvil-i20-working-set-${{ matrix.corpus }}-${{ github.run_id }}
          path: ${{ env.OUT_DIR }}
          if-no-files-found: error
          retention-days: 30

  fuzz-registry:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      OUT_DIR: ${{ github.workspace }}/i20-w4-fuzz
      CANDIDATE_REF: ${{ inputs.candidate_ref }}

    steps:
      - name: Checkout candidate source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_REF }}
          path: candidate

      - name: Install pinned dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-18 cmake ninja-build libbrotli-dev libzstd-dev \
            xz-utils time python3

      - name: Fingerprint runner and source
        run: |
          mkdir -p "$OUT_DIR"
          {
            echo "utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "workflow_sha=${GITHUB_SHA}"
            echo "workflow_ref=${GITHUB_REF}"
            echo "candidate_ref=$CANDIDATE_REF"
            echo "candidate_sha=$(git -C candidate rev-parse HEAD)"
            echo "candidate_src_sha256=$(sha256sum candidate/src/anvil.cpp | cut -d' ' -f1)"
            echo "candidate_fuzz_sha256=$(sha256sum candidate/tests/fuzz.py | cut -d' ' -f1)"
            uname -a
            lscpu
            clang-18 --version
          } | tee "$OUT_DIR/provenance.txt"

      - name: Build candidate
        run: |
          cmake -S candidate -B candidate/build-fuzz -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DANVIL_BUILD_NATIVE_BENCH=OFF
          cmake --build candidate/build-fuzz --parallel 4 --target anvil
          sha256sum candidate/build-fuzz/anvil | tee "$OUT_DIR/binary-sha256.txt"

      - name: In-place inverse-BWT equivalence prototype
        run: |
          set -euo pipefail
          clang -O2 -DNDEBUG -std=c11 -I candidate/third_party/libsais/include \
            -c candidate/third_party/libsais/src/libsais.c -o "$OUT_DIR/libsais.o"
          clang++ -O2 -std=c++17 -I candidate/third_party/libsais/include \
            candidate/prototypes/i20-working-set/inplace_unbwt.cpp \
            "$OUT_DIR/libsais.o" -o "$OUT_DIR/inplace_unbwt"
          "$OUT_DIR/inplace_unbwt" | tee "$OUT_DIR/inplace_unbwt.txt"

      - name: Repo fuzz / registry coverage path
        run: |
          set -euo pipefail
          python3 candidate/tests/fuzz.py \
            --exe candidate/build-fuzz/anvil \
            --cases 120 --seed 0xA11E --mutations 6 \
            | tee "$OUT_DIR/fuzz.txt"

      - name: Round-trip on the repo tests/corpus fixtures
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          out = pathlib.Path(os.environ["OUT_DIR"])
          exe = pathlib.Path("candidate/build-fuzz/anvil").resolve()
          fixtures = sorted(p for p in pathlib.Path("candidate/tests/corpus").iterdir() if p.is_file())
          rows = []
          bad = 0
          for fx in fixtures:
              for aux in ("on", "off"):
                  packed = out / "fx" / f"{fx.name}.{aux}.anv"
                  packed.parent.mkdir(parents=True, exist_ok=True)
                  cmd = [str(exe), "c", str(fx), str(packed), "--parse=ratio",
                         "--ratio-backend=auto", "--ratio-context=off", "--ratio-lines=off",
                         f"--bwt-aux={aux}", "--quiet"]
                  p = subprocess.run(cmd, stderr=subprocess.PIPE)
                  if p.returncode:
                      continue  # some fixtures are intentionally not ratio-encodable
                  dec = out / "fx" / f"{fx.name}.{aux}.out"
                  p = subprocess.run([str(exe), "d", str(packed), str(dec), "--quiet"], stderr=subprocess.PIPE)
                  if p.returncode:
                      raise SystemExit(f"decode failed {fx.name} aux={aux}: {p.stderr.decode()[-2000:]}")
                  same = (dec.read_bytes() == fx.read_bytes())
                  if not same:
                      bad += 1
                  rows.append({"fixture": fx.name, "bwt_aux": aux, "bytes": fx.stat().st_size,
                               "compressed": packed.stat().st_size, "matches_source": same})
          import csv
          with (out / "fixtures-roundtrip.csv").open("w", newline="", encoding="utf-8") as f:
              w = csv.DictWriter(f, fieldnames=list(rows[0].keys()) if rows else ["fixture"])
              w.writeheader()
              w.writerows(rows)
          print(f"fixture rows={len(rows)} mismatches={bad}")
          if bad:
              raise SystemExit("FIXTURE ROUND-TRIP MISMATCH")
          PY

      - name: Upload fuzz evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: anvil-i20-working-set-fuzz-${{ github.run_id }}
          path: ${{ env.OUT_DIR }}
          if-no-files-found: error
          retention-days: 30
