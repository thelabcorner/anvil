name: ANVIL I16 complete-wire hybrid envelope
on: workflow_dispatch
permissions:
  contents: read
jobs:
  discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SOURCE: prototypes/i16-envelope/i16_envelope.cpp
      SOURCE_SHA: 0162ccfab90607393698e12d410509e3d09e31cf77336139e42a830a4837a418
      SOURCE_BLOB: 617147803d519e12cf3a6c74878c7125aef6b96c
      LEAF: prototypes/i14-differential/i14_differential.cpp
      LEAF_SHA: f4f75b098feee9753084fa5cc132e31064f107fbd8ffa621f5e415b57d825150
      LEAF_BLOB: 365348ac5b8295f32eed97fb9427bb5516c43b16
      BROTLI_SHA: ed738e842d2fbdf2d6459e39267a633c4a9b2f5d
      BROTLI_SRC: ${{ github.workspace }}/../i16-brotli-src
      BROTLI_BUILD: ${{ github.workspace }}/../i16-brotli-build
      OUT: ${{ github.workspace }}/i16-results
    steps:
      - name: Checkout exact dispatched revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Assert immutable code and fixed tracked corpus
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "HEAD:$SOURCE")" = "$SOURCE_BLOB"
          test "$(git rev-parse "HEAD:$LEAF")" = "$LEAF_BLOB"
          echo "$SOURCE_SHA  $SOURCE" | sha256sum -c -
          echo "$LEAF_SHA  $LEAF" | sha256sum -c -
          test -z "$(git status --porcelain)"
          mkdir -p "$OUT"
          {
            echo "workflow_commit=$GITHUB_SHA"
            echo "source=$SOURCE_BLOB sha256=$SOURCE_SHA"
            echo "I14_leaf=$LEAF_BLOB sha256=$LEAF_SHA"
            echo "Brotli_commit=$BROTLI_SHA"
            echo "class=consumed-discovery promotion=false novelty=false"
            g++ --version | head -n1
            cmake --version | head -n1
          } | tee "$OUT/provenance.txt"
          for f in tests/corpus/synth-arith.bin tests/corpus/synth-timeseries.bin tests/corpus/synth-jitter.bin tests/corpus/random.bin tests/corpus/generated.repeat.jsonl tests/corpus/generated.jsonl tests/corpus/src.cpp; do
            test -f "$f"
            blob="$(git rev-parse "HEAD:$f")"
            test "$(git hash-object "$f")" = "$blob"
            echo "$f blob=$blob sha256=$(sha256sum "$f" | cut -d' ' -f1)" | tee -a "$OUT/provenance.txt"
          done
      - name: Compile pinned Brotli static reference
        shell: bash
        run: |
          set -euo pipefail
          git init -q "$BROTLI_SRC"
          git -C "$BROTLI_SRC" remote add origin https://github.com/google/brotli.git
          git -C "$BROTLI_SRC" fetch -q --depth 1 origin "$BROTLI_SHA"
          git -C "$BROTLI_SRC" checkout -q --detach FETCH_HEAD
          test "$(git -C "$BROTLI_SRC" rev-parse HEAD)" = "$BROTLI_SHA"
          cmake -S "$BROTLI_SRC" -B "$BROTLI_BUILD" -DCMAKE_BUILD_TYPE=Release -DBROTLI_DISABLE_TESTS=ON -DBUILD_SHARED_LIBS=OFF
          cmake --build "$BROTLI_BUILD" --target brotlienc brotlidec brotlicommon -j 2
      - name: Compile I16 envelope including immutable I14 leaf
        shell: bash
        run: |
          set -euo pipefail
          lib() { find "$BROTLI_BUILD" -name "lib$1.a" -print -quit; }
          for name in brotlienc brotlidec brotlicommon; do test -f "$(lib "$name")"; done
          g++ -std=c++20 -O3 -DNDEBUG -Wall -Wextra -Wpedantic -DI12_WITH_BROTLI \
            -I "$BROTLI_SRC/c/include" "$SOURCE" -o "$RUNNER_TEMP/i16" \
            "$(lib brotlienc)" "$(lib brotlidec)" "$(lib brotlicommon)" -pthread
          sha256sum "$RUNNER_TEMP/i16" | tee "$OUT/binary-hashes.txt"
          wc -c "$RUNNER_TEMP/i16" | tee "$OUT/binary-sizes.txt"
      - name: Exact roundtrips and malformed envelope selftest
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/i16" --selftest | tee "$OUT/selftest.txt"
          grep -F "SELFTEST PASS" "$OUT/selftest.txt"
          for f in tests/corpus/synth-arith.bin tests/corpus/synth-timeseries.bin tests/corpus/synth-jitter.bin tests/corpus/random.bin tests/corpus/generated.repeat.jsonl tests/corpus/generated.jsonl tests/corpus/src.cpp; do
            "$RUNNER_TEMP/i16" --encode "$f" "$OUT/current.avh1"
            "$RUNNER_TEMP/i16" --decode "$OUT/current.avh1" "$OUT/decoded.bin"
            cmp "$f" "$OUT/decoded.bin"
            echo "ROUNDTRIP_PASS $f" | tee -a "$OUT/roundtrips.txt"
          done
      - name: Paired digest-inclusive full-file discovery and exact size oracle
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/i16" --bench \
            tests/corpus/synth-arith.bin tests/corpus/synth-timeseries.bin tests/corpus/synth-jitter.bin \
            tests/corpus/random.bin tests/corpus/generated.repeat.jsonl tests/corpus/generated.jsonl \
            tests/corpus/src.cpp | tee "$OUT/benchmark.tsv"
          python3 tools/i16_decide.py "$OUT/benchmark.tsv" "$OUT/decision.json"
      - name: Upload complete available evidence even on failure
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: anvil-i16-${{ github.sha }}-run${{ github.run_attempt }}
          path: ${{ env.OUT }}
          if-no-files-found: warn
          retention-days: 90
