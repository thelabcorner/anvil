# Q1a-XRUN cross-runner reproducibility / source-attestation workflow DRAFT.
#
# NOT installed under .github/workflows by this closeout. Publishing/tracking this
# workflow is a coordinator action. It performs no codec benchmark, no corpus fetch,
# no sealed-byte read, no archive decompression, and no package installation.
#
# Scientific purpose:
#   1. prove the exact Q1a tool/emitter source bytes are the preregistered bytes;
#   2. prove bounded self-tests pass on the GitHub Linux runner;
#   3. reproduce the deterministic synthetic fixture artifacts byte-for-byte against
#      the Windows preregistration anchor;
#   4. treat the expected CORPUS_BLOCKED / attestation_backed result as SUCCESS for
#      infrastructure reproducibility, never as corpus promotion.
#
# Promotion/generalization remains independently blocked by c9 + evidence-role gates.

name: ANVIL Q1a XRUN source and reproducibility attestation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anvil-q1a-xrun-${{ github.ref_name }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  xrun:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      Q1A_DIR: prototypes/swarm-2026-10-02/q1a-corpus-lock/space-bunny
      # Keep outputs outside the checkout: the source-cleanliness assertion runs
      # after mkdir and must not self-contaminate the Git worktree.
      OUT_DIR: ${{ runner.temp }}/q1a-xrun-results

      # Publication candidate source identities. Re-bind these if and only if
      # publication changes file bytes. Git clean-filter analysis on the current
      # tree found no attributes and core.autocrlf=false.
      EXPECTED_TOOL_BLOB: 0d2467c719daef37d301fa221fb8b4b3d069934b
      EXPECTED_TOOL_SHA256: c0c027e15f2a572d2816396129a1d0ed950bdd86dbf84d3c3d1e6310ccb399a4
      EXPECTED_EMITTER_BLOB: 07720d4fbba9e4f77143e873fb70d8a05154da43
      EXPECTED_EMITTER_SHA256: 255ec7d56633bc4fa970024d446586cdd18afc3d8d7d5930257c85dc953dc3fb

      # Cross-runner byte anchors generated twice locally from the exact source above.
      EXPECTED_MANIFEST_SHA256: feaa7848967d8245dc16f5d531fcc1e5c9f2898e941b6f5a424182301c4fec5c
      EXPECTED_SUMMARY_SHA256: 112add224d0017e6bbb7fad083424d90c3818526416de546f3000e00216dcdaa

    steps:
      - name: Checkout exact workflow commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Assert immutable Q1a source identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          TOOL="$Q1A_DIR/q1a_corpus_lock.py"
          EMITTER="$Q1A_DIR/q1a_xrun_fixture.py"

          test -f "$TOOL"
          test -f "$EMITTER"

          got_tool_blob="$(git rev-parse "HEAD:$TOOL")"
          got_emitter_blob="$(git rev-parse "HEAD:$EMITTER")"
          test "$got_tool_blob" = "$EXPECTED_TOOL_BLOB" || {
            echo "::error::tool blob drift want=$EXPECTED_TOOL_BLOB got=$got_tool_blob"; exit 1; }
          test "$got_emitter_blob" = "$EXPECTED_EMITTER_BLOB" || {
            echo "::error::emitter blob drift want=$EXPECTED_EMITTER_BLOB got=$got_emitter_blob"; exit 1; }

          got_tool_sha="$(sha256sum "$TOOL" | cut -d' ' -f1)"
          got_emitter_sha="$(sha256sum "$EMITTER" | cut -d' ' -f1)"
          test "$got_tool_sha" = "$EXPECTED_TOOL_SHA256" || {
            echo "::error::tool sha256 drift want=$EXPECTED_TOOL_SHA256 got=$got_tool_sha"; exit 1; }
          test "$got_emitter_sha" = "$EXPECTED_EMITTER_SHA256" || {
            echo "::error::emitter sha256 drift want=$EXPECTED_EMITTER_SHA256 got=$got_emitter_sha"; exit 1; }

          test -z "$(git status --porcelain)" || {
            echo "::error::checkout is dirty before Q1a execution"; git status --porcelain; exit 1; }

          {
            echo "workflow_commit_sha=$GITHUB_SHA"
            echo "source_tree_ref=$GITHUB_SHA"
            echo "source_dirty=false"
            echo "tool_blob=$got_tool_blob"
            echo "tool_sha256=$got_tool_sha"
            echo "emitter_blob=$got_emitter_blob"
            echo "emitter_sha256=$got_emitter_sha"
            echo "runner_image=ubuntu-24.04"
            python3 --version
          } | tee "$OUT_DIR/provenance.txt"

      - name: Run bounded Q1a self-test
        shell: bash
        run: |
          set -euo pipefail
          cd "$Q1A_DIR"
          python3 q1a_corpus_lock.py selftest | tee "$OUT_DIR/selftest.txt"
          grep -F "Q1a self-test: 135 checks, 0 failed" "$OUT_DIR/selftest.txt"
          grep -F "tool source_sha256: $EXPECTED_TOOL_SHA256" "$OUT_DIR/selftest.txt"

      - name: Emit deterministic fixture twice
        shell: bash
        run: |
          set -euo pipefail
          cd "$Q1A_DIR"
          rm -rf "$OUT_DIR/a" "$OUT_DIR/b"
          python3 q1a_xrun_fixture.py --out "$OUT_DIR/a" --summary "$OUT_DIR/a-summary.json"
          python3 q1a_xrun_fixture.py --out "$OUT_DIR/b" --summary "$OUT_DIR/b-summary.json"

          diff -qr "$OUT_DIR/a" "$OUT_DIR/b"
          cmp "$OUT_DIR/a-summary.json" "$OUT_DIR/b-summary.json"

          got_manifest="$(sha256sum "$OUT_DIR/a/artifact-manifest.json" | cut -d' ' -f1)"
          got_summary="$(sha256sum "$OUT_DIR/a-summary.json" | cut -d' ' -f1)"
          test "$got_manifest" = "$EXPECTED_MANIFEST_SHA256" || {
            echo "::error::cross-runner artifact manifest differs want=$EXPECTED_MANIFEST_SHA256 got=$got_manifest"; exit 1; }
          test "$got_summary" = "$EXPECTED_SUMMARY_SHA256" || {
            echo "::error::cross-runner summary differs want=$EXPECTED_SUMMARY_SHA256 got=$got_summary"; exit 1; }

          echo "artifact_manifest_sha256=$got_manifest" | tee -a "$OUT_DIR/provenance.txt"
          echo "summary_sha256=$got_summary" | tee -a "$OUT_DIR/provenance.txt"

      - name: Assert expected semantic result
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$OUT_DIR/a-summary.json" <<'PY'
          import json, sys
          p = sys.argv[1]
          d = json.load(open(p, encoding="utf-8"))
          expected = {
              "verdict": "CORPUS_BLOCKED",
              "audit_complete": True,
              "graph_verification": "attestation_backed",
              "independence_units_authoritative_for_promotion": False,
              "independence_units": 7,
              "conflict_edges": 30,
              "not_evaluated": 113,
              "manifest_artifact_count": 13,
              "zero_network": True,
              "zero_codec": True,
              "zero_archive_decompressions": True,
              "zero_sealed_bytes": True,
          }
          bad = {k: (expected[k], d.get(k)) for k in expected if d.get(k) != expected[k]}
          if bad:
              raise SystemExit("XRUN semantic mismatch: " + repr(bad))
          print("XRUN semantic contract: PASS")
          PY

      - name: Write XRUN verdict
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$OUT_DIR/xrun-verdict.txt" <<'EOF'
          XRUN=PASS
          Meaning: source identity and deterministic synthetic artifact emission reproduced on the
          GitHub runner. This does NOT mean the corpus is promotion-grade. The expected fixture
          verdict remains CORPUS_BLOCKED and c9 remains attestation_backed.
          EOF

      - name: Upload complete XRUN evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: anvil-q1a-xrun-${{ github.sha }}-run${{ github.run_attempt }}
          path: ${{ env.OUT_DIR }}
          if-no-files-found: error
          retention-days: 90
