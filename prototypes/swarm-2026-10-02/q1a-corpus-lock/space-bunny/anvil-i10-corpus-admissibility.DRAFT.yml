name: ANVIL Q1a-XRUN corpus-admissibility determinism

# DRAFT ONLY.
# Install as .github/workflows/anvil-i10-corpus-admissibility.yml only after:
#   1) q1a_corpus_lock.py and the dedicated xrun/ lock+tombstone are tracked,
#   2) the pinned checkout is clean,
#   3) every OPEN-role byte named by the XRUN lock is present in that checkout,
#   4) no host-installed/current-worktree-only object is required by the XRUN lock.
# This job attests cross-runner determinism of the audit machinery. It does NOT
# make the current 24-object real corpus remotely reproducible or promotion-grade.

on:
  workflow_dispatch:
    inputs:
      implementation_sha:
        description: 40-hex commit containing the frozen tool + XRUN lock
        required: true
        type: string
      tool_sha256:
        description: SHA-256 of q1a_corpus_lock.py at implementation_sha
        required: true
        type: string
      lock_sha256:
        description: SHA-256 of xrun/corpus-lock.json
        required: true
        type: string
      tombstone_sha256:
        description: SHA-256 of xrun/consumed-controls.json
        required: true
        type: string
      expected_report_sha256:
        description: Preregistered SHA-256 of admissibility-report.json
        required: true
        type: string
      expected_units:
        description: Preregistered independence_units for the XRUN fixture
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: anvil-q1a-xrun-${{ inputs.implementation_sha }}
  cancel-in-progress: false

jobs:
  attest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TOOL: prototypes/swarm-2026-10-02/q1a-corpus-lock/space-bunny/q1a_corpus_lock.py
      LOCK: prototypes/swarm-2026-10-02/q1a-corpus-lock/space-bunny/xrun/corpus-lock.json
      TOMBSTONE: prototypes/swarm-2026-10-02/q1a-corpus-lock/space-bunny/xrun/consumed-controls.json
      OUT: q1a-xrun-results

    steps:
      - name: Validate dispatch inputs before checkout
        env:
          IMPLEMENTATION_SHA: ${{ inputs.implementation_sha }}
          TOOL_SHA256: ${{ inputs.tool_sha256 }}
          LOCK_SHA256: ${{ inputs.lock_sha256 }}
          TOMBSTONE_SHA256: ${{ inputs.tombstone_sha256 }}
          EXPECTED_REPORT_SHA256: ${{ inputs.expected_report_sha256 }}
          EXPECTED_UNITS: ${{ inputs.expected_units }}
        run: |
          set -euo pipefail
          printf '%s' "$IMPLEMENTATION_SHA" | grep -Eq '^[0-9a-f]{40}$'
          for x in "$TOOL_SHA256" "$LOCK_SHA256" "$TOMBSTONE_SHA256" "$EXPECTED_REPORT_SHA256"; do
            printf '%s' "$x" | grep -Eq '^[0-9a-f]{64}$'
          done
          printf '%s' "$EXPECTED_UNITS" | grep -Eq '^[0-9]+$'

      - name: Checkout frozen implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.implementation_sha }}
          fetch-depth: 0

      - name: Assert pinned clean source identity
        env:
          IMPLEMENTATION_SHA: ${{ inputs.implementation_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$IMPLEMENTATION_SHA"
          test -z "$(git status --porcelain)"
          test -z "$(git diff --stat)"
          test -z "$(git stash list)"

      - name: Bind tool and XRUN inputs to the pinned commit
        env:
          TOOL_SHA256: ${{ inputs.tool_sha256 }}
          LOCK_SHA256: ${{ inputs.lock_sha256 }}
          TOMBSTONE_SHA256: ${{ inputs.tombstone_sha256 }}
        run: |
          set -euo pipefail
          for path in "$TOOL" "$LOCK" "$TOMBSTONE"; do
            git cat-file -e "HEAD:$path"
            test "$(git hash-object "$path")" = "$(git rev-parse "HEAD:$path")"
          done
          test "$(sha256sum "$TOOL" | awk '{print $1}')" = "$TOOL_SHA256"
          test "$(sha256sum "$LOCK" | awk '{print $1}')" = "$LOCK_SHA256"
          test "$(sha256sum "$TOMBSTONE" | awk '{print $1}')" = "$TOMBSTONE_SHA256"

      - name: Run bounded tool self-test
        run: |
          set -euo pipefail
          python3 "$TOOL" selftest

      - name: Run frozen corpus-admissibility audit
        id: audit
        run: |
          set -euo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"
          set +e
          python3 "$TOOL" audit \
            --lock "$LOCK" \
            --tombstone "$TOMBSTONE" \
            --subject-root "$GITHUB_WORKSPACE" \
            --emit-dir "$OUT"
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$OUT/audit-exit-code.txt"
          # XRUN is intentionally a non-promotable fixture. CORPUS_BLOCKED => exit 1
          # is a valid semantic result; identity/determinism, not promotion, is the job gate.
          test "$rc" -eq 1

      - name: Assert zero forbidden exposure
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          c = json.loads(Path("q1a-xrun-results/counters.json").read_text())
          expected_zero = (
              "network_ops",
              "codec_invocations",
              "archive_decompressions",
              "sealed_byte_reads",
          )
          bad = {k: c.get(k) for k in expected_zero if c.get(k) != 0}
          if bad:
              raise SystemExit(f"forbidden exposure counters nonzero: {bad}")
          for k in ("zero_network", "zero_codec", "zero_archive_decompression", "zero_sealed_bytes"):
              if c.get(k) is not True:
                  raise SystemExit(f"{k} is not true: {c.get(k)!r}")
          PY

      - name: Assert preregistered report digest
        env:
          EXPECTED_REPORT_SHA256: ${{ inputs.expected_report_sha256 }}
        run: |
          set -euo pipefail
          actual="$(sha256sum "$OUT/admissibility-report.json" | awk '{print $1}')"
          printf 'expected_report_sha256=%s\nactual_report_sha256=%s\n' \
            "$EXPECTED_REPORT_SHA256" "$actual" | tee "$OUT/determinism.txt"
          test "$actual" = "$EXPECTED_REPORT_SHA256"

      - name: Record preregistered unit-count comparison
        env:
          EXPECTED_UNITS: ${{ inputs.expected_units }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p = Path("q1a-xrun-results/independence-units.json")
          d = json.loads(p.read_text())
          actual = d.get("independence_units")
          expected = int(os.environ["EXPECTED_UNITS"])
          out = {
              "expected_units": expected,
              "actual_units": actual,
              "matches": actual == expected,
              "decisional_for_workflow": False,
              "note": "A mismatch is a scientific finding, not an infrastructure failure.",
          }
          Path("q1a-xrun-results/unit-count-comparison.json").write_text(
              json.dumps(out, sort_keys=True, separators=(",", ":")) + "\n"
          )
          print(json.dumps(out, indent=2, sort_keys=True))
          PY

      - name: Assert expected semantic verdict
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          v = json.loads(Path("q1a-xrun-results/verdict.json").read_text())
          if v.get("status") != "CORPUS_BLOCKED":
              raise SystemExit(f"expected CORPUS_BLOCKED, got {v.get('status')!r}")
          if v.get("promotion_authorized") is not False:
              raise SystemExit("promotion_authorized must remain false")
          PY

      - name: Emit deterministic artifact manifest
        if: ${{ always() }}
        env:
          IMPLEMENTATION_SHA: ${{ inputs.implementation_sha }}
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          IMPLEMENTATION_SHA="$IMPLEMENTATION_SHA" python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path("q1a-xrun-results")
          rows = []
          for p in sorted(root.iterdir(), key=lambda x: x.name):
              if not p.is_file() or p.name == "artifact-manifest-xrun.json":
                  continue
              b = p.read_bytes()
              rows.append({"path": p.name, "bytes": len(b), "sha256": hashlib.sha256(b).hexdigest()})
          manifest = {
              "schema": "anvil.q1a-xrun-artifact-manifest/v1",
              "implementation_sha": os.environ["IMPLEMENTATION_SHA"],
              "artifact_count": len(rows),
              "artifacts": rows,
          }
          (root / "artifact-manifest-xrun.json").write_text(
              json.dumps(manifest, sort_keys=True, separators=(",", ":")) + "\n"
          )
          PY

      - name: Upload attestation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: corpus-admissibility-${{ inputs.implementation_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: q1a-xrun-results/
          if-no-files-found: error
          retention-days: 90
