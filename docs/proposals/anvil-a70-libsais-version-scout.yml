name: ANVIL A70 — libsais serial decoder version scout (manual only)
run-name: A70 ${{ inputs.phase }} — ${{ inputs.label }}

# Manual protocol validation precedes the separately requested bounded scout.
# No push, pull_request, schedule, or automatic execution triggers.
on:
  workflow_dispatch:
    inputs:
      label:
        description: 'Unique concurrency label for this explicitly manual run'
        type: string
        required: true
        default: 'a70-version-scout'
      phase:
        description: 'Protocol-only never builds or benchmarks the codec'
        type: choice
        required: true
        default: 'protocol-only'
        options:
          - protocol-only
          - scout
      candidate_sha:
        description: 'Full immutable reviewed candidate commit (40 lowercase hex characters)'
        type: string
        required: true
      reps:
        description: 'Complete interleaved pairs per session; never reduced to fit budget'
        type: choice
        required: true
        default: '9'
        options:
          - '9'
          - '13'

permissions:
  contents: read

concurrency:
  group: anvil-a70-${{ inputs.label }}
  cancel-in-progress: false

jobs:
  serial-version-scout:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OUT_DIR: ${{ github.workspace }}/a70
      OLD_SHA: 2c5eeb9e570b1e1162cbff98d29e0a978edeca92
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      A70_PHASE: ${{ inputs.phase }}
      A70_REPS: ${{ inputs.reps }}
    steps:
      - name: Initialize evidence and absolute preparation budget
        timeout-minutes: 1
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Full immutable candidate SHA required'; exit 1; }
          case "$A70_REPS" in 9|13) ;; *) echo 'A70 requires 9 or 13 pairs'; exit 1 ;; esac
          STARTED=$(date +%s)
          echo "JOB_STARTED_EPOCH=$STARTED" >> "$GITHUB_ENV"
          echo "PREP_DEADLINE_EPOCH=$((STARTED + 900))" >> "$GITHUB_ENV"
          {
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "workflow_source_sha=$GITHUB_SHA"
            echo "candidate_requested_sha=$CANDIDATE_SHA"
            echo "phase=$A70_PHASE"
            echo "reps=$A70_REPS"
            echo 'preparation_budget_seconds=900'
            echo 'measurement_budget_seconds=1200'
            echo 'measurement_absolute_cutoff_seconds=2100'
            echo 'job_timeout_seconds=2700'
            echo 'upload_step_budget_seconds=300'
          } > "$OUT_DIR/dispatch.txt"

      - name: Checkout FROZEN old-codec baseline
        timeout-minutes: 2
        uses: actions/checkout@v4
        with:
          ref: 2c5eeb9e570b1e1162cbff98d29e0a978edeca92
          path: old
          persist-credentials: false

      - name: Checkout reviewed candidate at immutable commit
        timeout-minutes: 2
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          path: candidate
          persist-credentials: false

      - name: Freeze source provenance and assert causal isolation
        timeout-minutes: 2
        run: |
          set -euo pipefail
          OLD_ACTUAL=$(git -C old rev-parse HEAD)
          NEW_ACTUAL=$(git -C candidate rev-parse HEAD)
          [ "$OLD_ACTUAL" = "$OLD_SHA" ] || { echo 'Incorrect frozen old source'; exit 1; }
          [ "$NEW_ACTUAL" = "$CANDIDATE_SHA" ] || { echo 'Candidate ref drift'; exit 1; }
          grep -q 'LIBSAIS_VERSION_STRING  "2.10.4"' old/third_party/libsais/include/libsais.h
          grep -q 'LIBSAIS_VERSION_STRING  "2.12.2"' candidate/third_party/libsais/include/libsais.h
          grep -q 'b1aa1fde090e00a4e2030b9fb54198698b84e463' candidate/third_party/libsais/UPSTREAM.md
          [ -z "$(git -C old status --porcelain)" ]
          [ -z "$(git -C candidate status --porcelain)" ]
          # Preserve the frozen driver, compiled codec, build and corpus logic.
          for f in src/anvil.cpp CMakeLists.txt tools/paired_bench.py tools/gha_fetch_corpus.py; do
            cmp "old/$f" "candidate/$f" || { echo "NON-LIBSAIS DIFFERENCE: $f"; exit 1; }
          done
          echo '9a42bf80f6a35bbec61f191a40daf416652e1ee9c35fd7461c5de13755209b08  candidate/tools/paired_bench.py' | sha256sum -c -
          {
            cat "$OUT_DIR/dispatch.txt"
            echo "old_code_sha=$OLD_ACTUAL"
            echo "candidate_code_sha=$NEW_ACTUAL"
            echo "tooling_sha=$NEW_ACTUAL"
            echo "runner_image=ubuntu-24.04"
            sha256sum old/third_party/libsais/src/libsais.c old/third_party/libsais/include/libsais.h
            sha256sum candidate/third_party/libsais/src/libsais.c candidate/third_party/libsais/include/libsais.h candidate/third_party/libsais/LICENSE
            sha256sum candidate/tools/a70_version_scout.py candidate/tools/a70_paired_capture.py candidate/tools/paired_bench.py candidate/tools/gha_fetch_corpus.py
            sha256sum candidate/tests/test_a70*.py candidate/docs/A70-PROTOCOL-CORRECTION-ACCEPTANCE-20261126.md
            python3 --version
            uname -a
            lscpu
          } | tee "$OUT_DIR/provenance.txt"

      - name: Run independent protocol tests on hosted CPU
        timeout-minutes: 6
        run: |
          set -euo pipefail
          REMAINING=$((PREP_DEADLINE_EPOCH - $(date +%s)))
          [ "$REMAINING" -gt 0 ] || { echo 'Preparation budget exhausted'; exit 1; }
          timeout --signal=TERM --kill-after=10s "${REMAINING}s" \
            python3 -u -m unittest discover -s candidate/tests -p 'test_a70*.py' -v \
            2>&1 | tee "$OUT_DIR/protocol-tests.log"

      - name: Install build dependencies on hosted runner
        if: ${{ inputs.phase == 'scout' }}
        timeout-minutes: 6
        run: |
          set -euo pipefail
          REMAINING=$((PREP_DEADLINE_EPOCH - $(date +%s)))
          [ "$REMAINING" -gt 0 ] || { echo 'Preparation budget exhausted'; exit 1; }
          timeout --signal=TERM --kill-after=10s "${REMAINING}s" bash -euo pipefail -c '
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends clang-18 cmake ninja-build libbrotli-dev libzstd-dev python3 util-linux time
          ' 2>&1 | tee "$OUT_DIR/dependencies.log"
          {
            clang-18 --version
            clang++-18 --version
            clang-18 -dM -E -x c /dev/null | grep -E '__SSE2__|__AVX2__|__aarch64__' || true
          } | tee "$OUT_DIR/compiler.txt"

      - name: Build serial variants within the absolute preparation budget
        if: ${{ inputs.phase == 'scout' }}
        timeout-minutes: 15
        run: |
          set -euo pipefail
          REMAINING=$((PREP_DEADLINE_EPOCH - $(date +%s)))
          [ "$REMAINING" -gt 0 ] || { echo 'Preparation budget exhausted'; exit 1; }
          timeout --signal=TERM --kill-after=10s "${REMAINING}s" bash -euo pipefail -c '
            cmake -S old -B "$OUT_DIR/old-build" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
              -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18 \
              -DANVIL_BUILD_NATIVE_BENCH=OFF
            cmake -S candidate -B "$OUT_DIR/new-build" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
              -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18 \
              -DANVIL_BUILD_NATIVE_BENCH=OFF
            cmake --build "$OUT_DIR/old-build" --parallel 4 --target anvil
            cmake --build "$OUT_DIR/new-build" --parallel 4 --target anvil
          ' 2>&1 | tee "$OUT_DIR/build.log"
          ! grep -E -- '-march=native|-mavx2|-mavx512' "$OUT_DIR/old-build/compile_commands.json" "$OUT_DIR/new-build/compile_commands.json"
          cp "$OUT_DIR/old-build/compile_commands.json" "$OUT_DIR/old-compile-commands.json"
          cp "$OUT_DIR/new-build/compile_commands.json" "$OUT_DIR/new-compile-commands.json"
          {
            sha256sum "$OUT_DIR/old-build/anvil" "$OUT_DIR/new-build/anvil"
            wc -c "$OUT_DIR/old-build/anvil" "$OUT_DIR/new-build/anvil"
          } | tee "$OUT_DIR/binary-identities.txt"
          ldd "$OUT_DIR/old-build/anvil" > "$OUT_DIR/old-ldd.txt"
          ldd "$OUT_DIR/new-build/anvil" > "$OUT_DIR/new-ldd.txt"

      - name: Validate old-wire compatibility and measure paired serial decode
        if: ${{ inputs.phase == 'scout' }}
        timeout-minutes: 21
        run: |
          set -euo pipefail
          REMAINING=$((JOB_STARTED_EPOCH + 2100 - $(date +%s)))
          [ "$REMAINING" -le 1200 ] || REMAINING=1200
          [ "$REMAINING" -gt 630 ] || { echo 'Insufficient measurement budget'; exit 1; }
          timeout --signal=TERM --kill-after=10s "${REMAINING}s" \
            python3 -u candidate/tools/a70_version_scout.py \
              --old "$OUT_DIR/old-build/anvil" \
              --candidate "$OUT_DIR/new-build/anvil" \
              --tools candidate/tools \
              --out "$OUT_DIR" \
              --files dickens mr mozilla \
              --reps "$A70_REPS" \
              --budget-seconds "$((REMAINING - 15))" \
              --test-truncation 2>&1 | tee "$OUT_DIR/scout-console.log"

      - name: Upload bounded raw evidence after success or failure
        if: ${{ always() }}
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: anvil-a70-${{ inputs.phase }}-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            ${{ env.OUT_DIR }}/*.txt
            ${{ env.OUT_DIR }}/*.json
            ${{ env.OUT_DIR }}/*.log
            ${{ env.OUT_DIR }}/old-build/anvil
            ${{ env.OUT_DIR }}/new-build/anvil
            ${{ env.OUT_DIR }}/results/*.json
            ${{ env.OUT_DIR }}/results/*.jsonl
            ${{ env.OUT_DIR }}/results/*.csv
            ${{ env.OUT_DIR }}/results/*.txt
            ${{ env.OUT_DIR }}/results/*.log
            ${{ env.OUT_DIR }}/results/*.stdout
            ${{ env.OUT_DIR }}/results/*.stderr
            ${{ env.OUT_DIR }}/work/*/old.anv
